  <style>
    body {
      margin: 0;
      min-height: 100vh;

    }
    button {

    input, textarea, button {

    .cover-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      border-radius: 32px;
    }
    .cover-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1600&q=85');
      background-size: cover;
      background-position: center 40%;
      border-radius: 32px;
      filter: saturate(1.15) brightness(0.72);
    }
    .cover-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 32px;
      background:
        linear-gradient(180deg,
          rgba(2, 18, 8, 0.55) 0%,
          rgba(5, 28, 14, 0.25) 30%,
          rgba(4, 22, 10, 0.18) 55%,
          rgba(2, 14, 6, 0.72) 82%,

    }
    .cover-title-card {
      position: relative;
      z-index: 10;
      background: linear-gradient(135deg,
        rgba(5, 40, 20, 0.72) 0%,
        rgba(10, 55, 28, 0.65) 50%,
        rgba(5, 35, 18, 0.72) 100%
      );
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(155, 231, 167, 0.22);
      border-radius: 24px;
      padding: 32px 36px 28px;
      margin: 0 16px;
      box-shadow:
        0 8px 40px rgba(0,0,0,0.5),
        0 0 0 1px rgba(28,197,138,0.12),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .begin-glow-btn {
      background: linear-gradient(135deg, #1cc58a, #0f8a53);
      border: none;
      border-radius: 999px;
      padding: 18px 52px;
      color: #ffffff;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;

      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      z-index: 10;
    }
    .begin-glow-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 0 60px rgba(28,197,138,0.8), 0 0 120px rgba(28,197,138,0.3), inset 0 -3px 14px rgba(255,255,255,0.25);
    }
    @keyframes particleDrift {
      0% { transform: translateY(0px) translateX(0px) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-120px) translateX(30px) rotate(360deg); opacity: 0; }
    }
    @keyframes mountainFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes riverFlow {
      0% { stroke-dashoffset: 300; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cloudDrift {
      0% { transform: translateX(-20px); opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { transform: translateX(20px); opacity: 0.3; }
    }
    @keyframes waveAnim {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes sandDrift {
      0% { transform: translateX(-40px) rotate(0deg); opacity: 0.4; }
      50% { opacity: 0.8; }
      100% { transform: translateX(40px) rotate(10deg); opacity: 0.4; }
    }
    @keyframes islandBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }
    @keyframes plateauGlow {
      0%, 100% { filter: drop-shadow(0 4px 12px rgba(240, 150, 60, 0.3)); }
      50% { filter: drop-shadow(0 8px 24px rgba(240, 150, 60, 0.7)); }

    @keyframes voicePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(28,197,138,0.6); }
      50% { transform: scale(1.06); box-shadow: 0 0 0 12px rgba(28,197,138,0); }
    }
    @keyframes menuCardPop {
      0% { opacity: 0; transform: scale(0.85) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes shimmerLine {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes rotateOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes countryOutline {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(155, 231, 167, 0.4)); }

      10% { opacity: 1; }
      90% { opacity: 0.6; }
      100% { transform: translateY(40px) translateX(8px); opacity: 0; }
    }
    .particle { animation: particleDrift linear infinite; position: absolute; pointer-events: none; }

          { q: "What are the three main ranges of the Himalayas?", a: "1. Himadri (Greater Himalayas) – highest & innermost, always snow-covered.\n2. Himachal (Lesser Himalayas) – middle range with famous hill stations.\n3. Shiwalik (Outer Himalayas) – lowest & outermost, transition to plains." },

            text: "The Ganga-Brahmaputra basin is called the 'Granary of India' — one of the most fertile regions in the world!",
          },
        ],
        activity: {
          type: "fill-blank",
          instruction: "Complete the sentences!",
          sentences: [
            { text: "The Northern Plains are formed by ___ soil.", answer: "alluvial", hint: "a______" },
            { text: "Punjab Plains mainly grow ___.", answer: "wheat", hint: "w____" },
            { text: "The Brahmaputra Plains are in ___.", answer: "Assam", hint: "A____" },
          ],
        },
      },
      {
        id: "quiz",
        type: "quiz",
        title: "Grand Quiz",
        subtitle: "Test everything you've learned!",
        questions: [
          {
            q: "What is Geographical Diversity?",
            options: [
              "Presence of different cultures only",
              "Variety in landforms, climates, vegetation & human adaptation",
              "Different languages spoken in India",
              "Types of food eaten across India",
            ],
            answer: 1,
            explanation: "Geographical Diversity means having different landforms, climates, vegetation, and ways people adapt to their environment.",
          },
          {
            q: "Which is the highest range of the Himalayas?",
            options: ["Shiwalik", "Himachal", "Himadri", "Vindhyas"],
            answer: 2,
            explanation: "Himadri (Greater Himalayas) is the highest and innermost range, with peaks above 6,000 metres!",
          },
          {
            q: "Why are Himalayas called the 'Water Tower of Asia'?",
            options: [
              "They have underground water tanks",
              "They receive the most rainfall in Asia",
              "Glaciers melt and feed major rivers",
              "They are the widest mountain range",
            ],
            answer: 2,
            explanation: "Himalayan glaciers store snow that melts and feeds the Ganga, Indus, and Brahmaputra rivers.",
          },
          {
            q: "The Northern Plains are formed by deposits from which rivers?",
            options: [
              "Krishna, Godavari, Cauvery",
              "Narmada, Tapti, Mahanadi",
              "Ganga, Yamuna, Brahmaputra",
              "Beas, Chenab, Ravi only",
            ],
            answer: 2,
            explanation: "The Northern Plains were formed by alluvial deposits from the Ganga, Yamuna, and Brahmaputra over millions of years.",
          },
          {
            q: "Which hill station is found in the Himachal range?",
            options: ["Haridwar", "Shimla", "Gangotri", "Patna"],
            answer: 1,
            explanation: "Shimla, Mussoorie, Darjeeling, and Nainital are all beautiful hill stations in the Himachal (Lesser Himalayas) range.",
          },
          {
            q: "The Himalayas were formed by collision of which plates?",
            options: [
              "African & Eurasian Plate",
              "Indo-Australian & Eurasian Plate",
              "Pacific & Indian Plate",
              "North American & Asian Plate",
            ],
            answer: 1,
            explanation: "India (Indo-Australian plate) drifted north from Gondwana and collided with the Eurasian plate ~50 million years ago!",
          },
        ],
      },
      {
        id: "certificate",
        type: "certificate",
        title: "Certificate of Completion",
      },
    ];

    const QUIZ_QUESTIONS = BOOK_PAGES.find(p => p.id === "quiz").questions;

    function App() {
      const [currentPage, setCurrentPage] = useState(0);
      const [pageHistory, setPageHistory] = useState([]);
      const [pageDir, setPageDir] = useState("forward");
      const [animating, setAnimating] = useState(false);
      const [completedPages, setCompletedPages] = useState(new Set());
      const [quizState, setQuizState] = useState({ index: 0, selected: null, done: false, score: 0, answers: [] });
      const [activityStates, setActivityStates] = useState({});
      const [studentName, setStudentName] = useState("");
      const [nameInput, setNameInput] = useState("");
      const [bookmarks, setBookmarks] = useState([]);
      const [showBookmarks, setShowBookmarks] = useState(false);
      const [fontSize, setFontSize] = useState(15);
      const [doubtText, setDoubtText] = useState("");
      const [doubts, setDoubts] = useState([]);
      const [aiLoading, setAiLoading] = useState(false);
      const [showDoubt, setShowDoubt] = useState(false);
      const [editMode, setEditMode] = useState(false);
      const [editedContent, setEditedContent] = useState({});
      const scrollRef = useRef(null);

      const page = BOOK_PAGES[currentPage];
      const totalPages = BOOK_PAGES.length;

      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTop = 0;
      }, [currentPage]);

      const goToPage = (idx) => {
        if (animating || idx < 0 || idx >= totalPages) return;
        setPageDir(idx > currentPage ? "forward" : "back");
        setAnimating(true);
        setPageHistory(prev => [...prev, currentPage]);
        setTimeout(() => {
          setCurrentPage(idx);
          setAnimating(false);
          setCompletedPages(prev => new Set([...prev, currentPage]));
        }, 300);
      };

      const goBack = () => {
        if (animating || pageHistory.length === 0) return;
        const prev = pageHistory[pageHistory.length - 1];
        setPageDir("back");
        setAnimating(true);
        setPageHistory(h => h.slice(0, -1));
        setTimeout(() => {
          setCurrentPage(prev);
          setAnimating(false);
        }, 300);
      };

      const toggleBookmark = () => {
        setBookmarks(prev =>
          prev.includes(currentPage)
            ? prev.filter(b => b !== currentPage)
            : [...prev, currentPage]
        );
      };

      const getActivityState = (pageId) => activityStates[pageId] || {};
      const setActivityState = (pageId, state) =>
        setActivityStates(prev => ({ ...prev, [pageId]: { ...prev[pageId], ...state } }));

      const askDoubt = async () => {
        if (!doubtText.trim()) return;
        const q = doubtText;
        setDoubtText("");
        setDoubts(prev => [...prev, { type: "user", text: q }]);
        setAiLoading(true);
        try {
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 1000,
              system: `You are a friendly, enthusiastic geography teacher for Grade 7 students (12-13 years old) teaching India's Geographical Diversity. Topics: 5 physical divisions, Himalayan ranges (Himadri, Himachal, Shiwalik), formation of Himalayas, importance of Himalayas, Northern Plains. Answer simply with emojis and relatable examples. Keep it to 3-5 sentences.`,
              messages: [{ role: "user", content: q }],
            }),
          });
          const data = await res.json();
          const answer = data.content?.[0]?.text || "Couldn't get an answer right now. Try again!";
          setDoubts(prev => [...prev, { type: "ai", text: answer }]);
        } catch {
          setDoubts(prev => [...prev, { type: "ai", text: "Oops! Connection issue. Please try again! 🙏" }]);
        }
        setAiLoading(false);
      };

      const getEditedTitle = (pageId, fallback) =>
        editedContent[pageId]?.title || fallback;

      const getEditedNote = (pageId) =>
        editedContent[pageId]?.note || "";

      const quizScore = quizState.score;
      const quizPercent = quizState.done ? Math.round((quizScore / QUIZ_QUESTIONS.length) * 100) : 0;

      const progressPercent = Math.round((completedPages.size / (totalPages - 2)) * 100);

      return (
        <div style={{
          fontFamily: "'Nunito', 'Segoe UI', sans-serif",
          background: "linear-gradient(135deg, #0a1628 0%, #0d1f3c 100%)",
          minHeight: "100vh",
          color: "#e8f4fd",
          display: "flex",
          flexDirection: "column",
          fontSize: fontSize,
        }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Cinzel:wght@700&display=swap');
            * { box-sizing: border-box; }
            ::-webkit-scrollbar { width: 4px; }
            ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
            @keyframes pageIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
            @keyframes pageInBack { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
            @keyframes sparkle { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
            @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
            .page-enter { animation: pageIn 0.32s ease forwards; }
            .page-enter-back { animation: pageInBack 0.32s ease forwards; }
            .fade-in { animation: fadeIn 0.4s ease forwards; }
            .floating-icon { animation: float 2s ease-in-out infinite; }
            .card-hover { transition: transform 0.18s, box-shadow 0.18s; }
            .card-hover:hover { transform: translateY(-3px); }
            input::placeholder { color: rgba(255,255,255,0.35); }
            textarea::placeholder { color: rgba(255,255,255,0.35); }
            .edit-border { outline: 2px dashed rgba(247,220,111,0.5) !important; outline-offset: 2px; border-radius: 6px; }
            button { cursor: pointer; }
          `}</style>

          <div style={{
            background: "rgba(0,0,0,0.4)",
            borderBottom: "1px solid rgba(255,255,255,0.08)",
            padding: "10px 16px",
            display: "flex",
            alignItems: "center",
            gap: 10,
            position: "sticky",
            top: 0,
            zIndex: 200,
            backdropFilter: "blur(8px)",
          }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 900, fontSize: 15, color: "#f7dc6f", lineHeight: 1.05, letterSpacing: 0.5 }}>India's Geographical Diversity</div>
              <div style={{ fontSize: 11, opacity: 0.6 }}>Grade 7 • Interactive Book</div>
            </div>
            <div style={{ flex: 1, maxWidth: 140 }}>
              <div style={{ background: "rgba(255,255,255,0.1)", borderRadius: 8, height: 6 }}>
                <div style={{ background: "linear-gradient(90deg,#82e0aa,#f7dc6f)", borderRadius: 8, height: "100%", width: `${progressPercent}%`, transition: "width 0.5s" }} />
              </div>
              <div style={{ fontSize: 11, opacity: 0.5, marginTop: 2 }}>Page {currentPage + 1} of {totalPages}</div>
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <button onClick={() => setFontSize(s => Math.max(12, s - 1))} style={{ background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 8, padding: "4px 8px", color: "#aed6f1", fontSize: 13 }}>A-</button>
              <button onClick={() => setFontSize(s => Math.min(20, s + 1))} style={{ background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 8, padding: "4px 8px", color: "#aed6f1", fontSize: 13 }}>A+</button>
              <button onClick={toggleBookmark} style={{ background: bookmarks.includes(currentPage) ? "rgba(247,220,111,0.2)" : "rgba(255,255,255,0.07)", border: `1px solid ${bookmarks.includes(currentPage) ? "#f7dc6f" : "rgba(255,255,255,0.12)"}`, borderRadius: 8, padding: "4px 8px", color: bookmarks.includes(currentPage) ? "#f7dc6f" : "#aed6f1", fontSize: 14 }} title="Bookmark">🔖</button>
              <button onClick={() => setShowBookmarks(s => !s)} style={{ background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 8, padding: "4px 8px", color: "#aed6f1", fontSize: 13 }}>📚</button>
              <button onClick={() => setEditMode(s => !s)} style={{ background: editMode ? "rgba(247,220,111,0.2)" : "rgba(255,255,255,0.07)", border: `1px solid ${editMode ? "#f7dc6f" : "rgba(255,255,255,0.12)"}`, borderRadius: 8, padding: "4px 8px", color: editMode ? "#f7dc6f" : "#aed6f1", fontSize: 13 }} title="Edit Mode">✏️</button>
              <button onClick={() => setShowDoubt(s => !s)} style={{ background: showDoubt ? "rgba(130,224,170,0.2)" : "rgba(255,255,255,0.07)", border: `1px solid ${showDoubt ? "#82e0aa" : "rgba(255,255,255,0.12)"}`, borderRadius: 8, padding: "4px 8px", color: showDoubt ? "#82e0aa" : "#aed6f1", fontSize: 13 }}>💬</button>
            </div>
          </div>

          {showBookmarks && (
            <div style={{ background: "rgba(0,0,0,0.6)", border: "1px solid rgba(255,255,255,0.1)", margin: "0 16px", borderRadius: 12, padding: 16, animation: "fadeIn 0.2s ease" }}>
              <div style={{ fontWeight: 700, color: "#f7dc6f", marginBottom: 10, fontSize: 13 }}>📚 Bookmarks & Navigation</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {BOOK_PAGES.map((p, i) => (
                  <button key={i} onClick={() => { goToPage(i); setShowBookmarks(false); }} style={{
                    background: bookmarks.includes(i) ? "rgba(247,220,111,0.15)" : currentPage === i ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.05)",
                    border: `1px solid ${bookmarks.includes(i) ? "#f7dc6f" : currentPage === i ? "rgba(255,255,255,0.3)" : "rgba(255,255,255,0.08)"}`,
                    borderRadius: 8, padding: "6px 12px",
                    color: bookmarks.includes(i) ? "#f7dc6f" : "#aed6f1",
                    fontSize: 12, fontWeight: currentPage === i ? 700 : 400,
                  }}>
                    {bookmarks.includes(i) ? "🔖" : ""}{i + 1}. {p.title || p.id}
                  </button>
                ))}
              </div>
            </div>
          )}

          {editMode && (
            <div style={{ background: "rgba(247,220,111,0.15)", border: "1px solid rgba(247,220,111,0.3)", margin: "0 16px", borderRadius: 10, padding: "10px 16px", display: "flex", gap: 10, alignItems: "center", animation: "fadeIn 0.2s ease" }}>
              <span style={{ fontSize: 14 }}>✏️</span>
              <span style={{ color: "#f7dc6f", fontSize: 13, flex: 1 }}>Edit Mode ON — Click on page title or add a personal note below each section!</span>
              <button onClick={() => setEditMode(false)} style={{ background: "rgba(247,220,111,0.2)", border: "1px solid #f7dc6f", borderRadius: 8, padding: "4px 10px", color: "#f7dc6f", fontSize: 12 }}>Done</button>
            </div>
          )}

          <div
            ref={scrollRef}
            style={{ flex: 1, overflowY: "auto", padding: "16px", maxWidth: 860, margin: "0 auto", width: "100%" }}
          >
            <div className={animating ? "" : pageDir === "forward" ? "page-enter" : "page-enter-back"}>
              <PageRenderer
                page={page}
                pageIndex={currentPage}
                editMode={editMode}
                editedContent={editedContent}
                setEditedContent={setEditedContent}
                getActivityState={getActivityState}
                setActivityState={setActivityState}
                quizState={quizState}
                setQuizState={setQuizState}
                studentName={studentName}
                setStudentName={setStudentName}
                nameInput={nameInput}
                setNameInput={setNameInput}
                quizPercent={quizPercent}
                goToPage={goToPage}
                setShowDoubt={setShowDoubt}
              />
            </div>
          </div>

          <div style={{
            background: "rgba(0,0,0,0.4)",
            borderTop: "1px solid rgba(255,255,255,0.08)",
            padding: "12px 20px",
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            backdropFilter: "blur(8px)",
          }}>
            <button
              onClick={goBack}
              disabled={pageHistory.length === 0}
              style={{
                background: pageHistory.length === 0 ? "rgba(255,255,255,0.03)" : "linear-gradient(135deg, #e74c3c, #c0392b)",
                border: pageHistory.length === 0 ? "1px solid rgba(255,255,255,0.12)" : "1px solid rgba(231,76,60,0.5)",
                borderRadius: 12, padding: "10px 20px",
                color: pageHistory.length === 0 ? "#555" : "#fff",
                fontSize: 14, fontWeight: 600,
                boxShadow: pageHistory.length === 0 ? "none" : "0 0 20px rgba(231,76,60,0.5), inset 0 0 10px rgba(255,255,255,0.15)",
                transition: "all 0.3s ease",
                transform: pageHistory.length === 0 ? "scale(1)" : "scale(1.02)",
              }}
            >← Back</button>

            <div style={{ display: "flex", gap: 5, flexWrap: "wrap", justifyContent: "center", maxWidth: 400 }}>
              {BOOK_PAGES.map((_, i) => (
                <button
                  key={i}
                  onClick={() => goToPage(i)}
                  style={{
                    width: i === currentPage ? 20 : 8, height: 8,
                    borderRadius: 4, border: "none",
                    background: i === currentPage ? "#f7dc6f" : completedPages.has(i) ? "rgba(130,224,170,0.5)" : "rgba(255,255,255,0.15)",
                    transition: "all 0.3s",
                    padding: 0,
                  }}
                />
              ))}
            </div>

            <button
              onClick={() => goToPage(currentPage + 1)}
              disabled={currentPage === totalPages - 1}
              style={{
                background: currentPage === totalPages - 1 ? "rgba(255,255,255,0.03)" : "linear-gradient(135deg, #27ae60, #1e8449)",
                border: currentPage === totalPages - 1 ? "1px solid rgba(255,255,255,0.12)" : "1px solid rgba(39,174,96,0.5)",
                borderRadius: 12, padding: "10px 20px",
                color: currentPage === totalPages - 1 ? "#555" : "#fff",
                fontSize: 14, fontWeight: 700,
                boxShadow: currentPage === totalPages - 1 ? "none" : "0 0 20px rgba(39,174,96,0.5), inset 0 0 10px rgba(255,255,255,0.15)",
                transition: "all 0.3s ease",
                transform: currentPage === totalPages - 1 ? "scale(1)" : "scale(1.02)",
              }}
            >Next →</button>
          </div>

          {showDoubt && (
            <div style={{
              position: "fixed", bottom: 70, right: 16,
              width: 340, maxHeight: 480,
              background: "linear-gradient(135deg, #1a2a3a, #0d1f30)",
              border: "1px solid rgba(255,255,255,0.12)",
              borderRadius: 20, padding: 16,
              display: "flex", flexDirection: "column", gap: 10,
              boxShadow: "0 8px 32px rgba(0,0,0,0.6)",
              zIndex: 300,
              animation: "fadeIn 0.25s ease",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ fontWeight: 700, color: "#f7dc6f", fontSize: 14 }}>💬 Ask Your AI Teacher</div>
                <button onClick={() => setShowDoubt(false)} style={{ background: "none", border: "none", color: "#aaa", fontSize: 18 }}>×</button>
              </div>
              <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 8, maxHeight: 300 }}>
                {doubts.length === 0 && (
                  <div style={{ color: "rgba(255,255,255,0.5)", fontSize: 13, textAlign: "center", padding: "20px 0" }}>Ask anything about this chapter! 🌍</div>
                )}
                {doubts.map((d, i) => (
                  <div key={i} style={{
                    background: d.type === "user" ? "rgba(230,126,34,0.25)" : "rgba(255,255,255,0.07)",
                    borderRadius: 12, padding: "8px 12px",
                    alignSelf: d.type === "user" ? "flex-end" : "flex-start",
                    maxWidth: "85%", fontSize: 13, lineHeight: 1.6,
                  }}>
                    {d.type === "ai" && <div style={{ fontSize: 11, color: "#82e0aa", fontWeight: 700, marginBottom: 4 }}>🤖 AI Teacher</div>}
                    {d.text}
                  </div>
                ))}
                {aiLoading && <div style={{ background: "rgba(255,255,255,0.07)", borderRadius: 12, padding: "8px 14px", fontSize: 13, alignSelf: "flex-start" }}>thinking... 💭</div>}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <input
                  value={doubtText}
                  onChange={e => setDoubtText(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && !aiLoading && askDoubt()}
                  placeholder="Type your question..."
                  style={{ flex: 1, background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 10, padding: "8px 12px", color: "#fff", fontSize: 13, outline: "none" }}
                />
                <button
                  onClick={askDoubt}
                  disabled={aiLoading || !doubtText.trim()}
                  style={{ background: doubtText.trim() && !aiLoading ? "linear-gradient(135deg, #e67e22, #d35400)" : "rgba(255,255,255,0.07)", border: "none", borderRadius: 10, padding: "0 14px", color: "#fff", fontSize: 16 }}
                >➤</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── CoverPage component ───────────────────────────────────────────────────
    function CoverPage({ page, editMode, displayTitle, updateEdit, goToPage }) {
      const [voicePlaying, setVoicePlaying] = React.useState(false);
      const [voiceText, setVoiceText] = React.useState("");
      const synth = window.speechSynthesis;

        const speakWelcome = () => {
          if (synth.speaking) { synth.cancel(); setVoicePlaying(false); setVoiceText(""); return; }
          const msg = new SpeechSynthesisUtterance(
            "Welcome to Geographical Diversity of India! I am your interactive guide on this amazing journey. India is the 7th largest country in the world and has incredible variety — from the mighty Himalayas in the north, to the golden Thar Desert, the fertile Northern Plains, the ancient Deccan Plateau, and the beautiful islands in the sea. Let us explore all 5 physical divisions of India together. Click Let's Start to begin your adventure!"
          );
          msg.rate = 0.92;
          msg.pitch = 1.05;
          msg.onstart = () => { setVoicePlaying(true); setVoiceText("🎙 Tap the mic again to stop"); };
          msg.onend = () => { setVoicePlaying(false); setVoiceText(""); };
          synth.speak(msg);
        };

        // Animated SVG physical divisions
        const divisions = [
          {
            id: "himalayas", label: "Himalayas", color: "#85c1e9", delay: "0s",
            svg: (
              <svg viewBox="0 0 120 90" style={{width:"100%",height:"100%"}}>
                <defs>
                  <linearGradient id="skyH" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#1a3a6c"/>
                    <stop offset="100%" stopColor="#2c5282"/>
                  </linearGradient>
                  <linearGradient id="snowG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#eaf4fb"/>
                    <stop offset="60%" stopColor="#aed6f1"/>
                  </linearGradient>
                </defs>
                <rect width="120" height="90" fill="url(#skyH)" rx="10"/>
                {/* Stars */}
                {[15,35,60,85,100,10,50,75].map((x,i)=>(
                  <circle key={i} cx={x} cy={[5,8,4,6,3,12,7,10][i]} r="0.8" fill="white" opacity="0.7"/>
                ))}
                {/* Mountains background */}
                <polygon points="0,70 20,35 40,50 60,20 80,40 100,25 120,45 120,90 0,90" fill="#1a2740" opacity="0.7"/>
                {/* Main peaks */}
                <polygon points="20,75 45,28 70,75" fill="#2c3e6b" style={{animation:"mountainFloat 3s ease-in-out infinite"}}/>
                <polygon points="40,75 60,18 80,75" fill="#34495e" style={{animation:"mountainFloat 3.5s ease-in-out infinite 0.5s"}}/>
                <polygon points="60,75 80,30 100,75" fill="#2c3e6b" style={{animation:"mountainFloat 4s ease-in-out infinite 1s"}}/>
                {/* Snow caps */}
                <polygon points="45,28 52,42 38,42" fill="url(#snowG)" opacity="0.95"/>
                <polygon points="60,18 67,34 53,34" fill="url(#snowG)" opacity="0.98"/>
                <polygon points="80,30 87,44 73,44" fill="url(#snowG)" opacity="0.95"/>
                {/* Snowflakes */}
                {[30,55,72,90].map((x,i)=>(
                  <text key={i} x={x} y="15" fontSize="5" fill="white" opacity="0.6"
                    style={{animation:`snowfall ${1.5+i*0.4}s linear infinite`,animationDelay:`${i*0.3}s`}}>❄</text>
                ))}
                {/* Label */}
                <text x="60" y="85" textAnchor="middle" fontSize="8" fill="#aed6f1" fontFamily="Nunito" fontWeight="800">🏔 Himalayas</text>
              </svg>
            )
          },
          {
            id: "plains", label: "N. Plains", color: "#82e0aa", delay: "0.1s",

              <svg viewBox="0 0 120 90" style={{width:"100%",height:"100%"}}>
                <defs>
                  <linearGradient id="skyP" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#1a4a2a"/>
                    <stop offset="100%" stopColor="#0b3320"/>
                  </linearGradient>
                  <linearGradient id="fieldG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#2ecc71"/>
                    <stop offset="100%" stopColor="#1a7a42"/>
                  </linearGradient>
                </defs>
                <rect width="120" height="90" fill="url(#skyP)" rx="10"/>
                {/* Sun */}
                <circle cx="95" cy="18" r="10" fill="#f7dc6f" opacity="0.85" style={{animation:"mountainFloat 4s ease-in-out infinite"}}/>
                <circle cx="95" cy="18" r="13" fill="#f7dc6f" opacity="0.2"/>
                {/* Fields */}
                <rect x="0" y="55" width="120" height="35" fill="url(#fieldG)" rx="0"/>
                {/* Crop rows */}
                {[10,25,40,55,70,85,100].map((x,i)=>(
                  <g key={i}>
                    <rect x={x} y="48" width="3" height="12" fill="#27ae60"/>
                    <ellipse cx={x+1.5} cy="46" rx="4" ry="6" fill="#2ecc71" style={{animation:`mountainFloat ${2+i*0.2}s ease-in-out infinite`,animationDelay:`${i*0.15}s`}}/>
                  </g>

                {/* River */}
                <path d="M0,68 Q30,62 60,68 Q90,74 120,68" stroke="#5dade2" strokeWidth="3" fill="none"
                  strokeDasharray="300" style={{animation:"riverFlow 3s linear infinite"}} opacity="0.8"/>
                {/* Clouds */}
                <ellipse cx="30" cy="22" rx="18" ry="7" fill="white" opacity="0.3" style={{animation:"cloudDrift 5s ease-in-out infinite"}}/>
                <ellipse cx="65" cy="16" rx="14" ry="5" fill="white" opacity="0.2" style={{animation:"cloudDrift 7s ease-in-out infinite reverse"}}/>
                <text x="60" y="87" textAnchor="middle" fontSize="8" fill="#a9dfbf" fontFamily="Nunito" fontWeight="800">🌾 N. Plains</text>
              </svg>
            )
          },
          {
            id: "desert", label: "Thar Desert", color: "#f9e79f", delay: "0.2s",
            svg: (
              <svg viewBox="0 0 120 90" style={{width:"100%",height:"100%"}}>
                <defs>
                  <linearGradient id="skyD" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#7d3c00"/>
                    <stop offset="100%" stopColor="#e07b2a"/>
                  </linearGradient>
                  <linearGradient id="sandG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#f5cba7"/>
                    <stop offset="100%" stopColor="#d4a574"/>
                  </linearGradient>
                </defs>
                <rect width="120" height="90" fill="url(#skyD)" rx="10"/>
                {/* Sun */}
                <circle cx="90" cy="20" r="14" fill="#f39c12" style={{animation:"mountainFloat 5s ease-in-out infinite"}}/>
                <circle cx="90" cy="20" r="20" fill="#f39c12" opacity="0.15"/>
                {/* Heat haze lines */}
                {[20,40,60,80].map((x,i)=>(
                  <line key={i} x1={x} y1="42" x2={x+8} y2="50" stroke="#f39c12" strokeWidth="0.8" opacity="0.3"
                    style={{animation:`cloudDrift ${2+i*0.3}s ease-in-out infinite`,animationDelay:`${i*0.2}s`}}/>
                ))}
                {/* Sand dunes */}
                <path d="M0,70 Q25,52 50,68 Q75,84 100,62 Q110,55 120,65 L120,90 L0,90 Z" fill="url(#sandG)"/>
                <path d="M0,78 Q30,68 60,76 Q90,84 120,74 L120,90 L0,90 Z" fill="#e8b98a" opacity="0.8"/>
                {/* Camel */}
                <g style={{animation:"mountainFloat 3s ease-in-out infinite"}}>
                  <ellipse cx="35" cy="58" rx="12" ry="6" fill="#c8a96c"/>
                  <ellipse cx="28" cy="54" rx="5" ry="7" fill="#c8a96c"/>
                  <circle cx="28" cy="49" r="4" fill="#c8a96c"/>
                  <rect x="22" y="62" width="3" height="8" rx="1.5" fill="#b8945c"/>
                  <rect x="28" y="62" width="3" height="8" rx="1.5" fill="#b8945c"/>
                  <rect x="37" y="62" width="3" height="7" rx="1.5" fill="#b8945c"/>
                  <rect x="43" y="62" width="3" height="7" rx="1.5" fill="#b8945c"/>
                  {/* Hump */}
                  <ellipse cx="37" cy="51" rx="6" ry="8" fill="#d4b57a"/>
                </g>
                {/* Sand particles */}
                {[15,45,70,95].map((x,i)=>(
                  <circle key={i} cx={x} cy={55+i*3} r="1.5" fill="#f5cba7" opacity="0.6"
                    style={{animation:`sandDrift ${2+i*0.5}s ease-in-out infinite`,animationDelay:`${i*0.3}s`}}/>
                ))}
                <text x="60" y="88" textAnchor="middle" fontSize="7.5" fill="#f9e79f" fontFamily="Nunito" fontWeight="800">🏜 Thar Desert</text>
              </svg>
            )
          },
          {
            id: "plateau", label: "Deccan", color: "#f0b27a", delay: "0.3s",
            svg: (
              <svg viewBox="0 0 120 90" style={{width:"100%",height:"100%"}}>
                <defs>
                  <linearGradient id="skyPl" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#3b1a08"/>
                    <stop offset="100%" stopColor="#7d3c10"/>
                  </linearGradient>
                </defs>
                <rect width="120" height="90" fill="url(#skyPl)" rx="10"/>
                {/* Plateau shape */}
                <path d="M5,65 L15,38 L35,38 L45,65" fill="#8b4513" style={{animation:"plateauGlow 3s ease-in-out infinite"}}/>
                <rect x="15" y="30" width="90" height="8" rx="3" fill="#a0522d" style={{animation:"plateauGlow 3.5s ease-in-out infinite 0.5s"}}/>
                <path d="M75,65 L85,38 L105,38 L115,65" fill="#8b4513"/>
                <rect x="5" y="65" width="110" height="22" rx="4" fill="#964b14"/>
                {/* Top surface with vegetation */}
                <rect x="15" y="28" width="90" height="4" fill="#5d7c3a"/>
                {/* Trees on top */}
                {[25,45,65,85,100].map((x,i)=>(
                  <g key={i} style={{animation:`mountainFloat ${2.5+i*0.3}s ease-in-out infinite`,animationDelay:`${i*0.2}s`}}>
                    <rect x={x} y="18" width="2.5" height="10" fill="#5d4037"/>
                    <circle cx={x+1.2} cy="15" r="5" fill="#388e3c"/>
                  </g>
                ))}
                {/* Rock textures */}
                {[20,50,80].map((x,i)=>(
                  <ellipse key={i} cx={x} cy="75" rx="8" ry="4" fill="#7a3b10" opacity="0.6"/>
                ))}
                <text x="60" y="88" textAnchor="middle" fontSize="8" fill="#f0b27a" fontFamily="Nunito" fontWeight="800">⛰ Deccan Plateau</text>
              </svg>
            )
          },
          {
            id: "islands", label: "Islands", color: "#d7bde2", delay: "0.4s",
            svg: (
              <svg viewBox="0 0 120 90" style={{width:"100%",height:"100%"}}>
                <defs>
                  <linearGradient id="oceanG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#0a3d6e"/>
                    <stop offset="100%" stopColor="#051f40"/>
                  </linearGradient>
                </defs>
                <rect width="120" height="90" fill="url(#oceanG)" rx="10"/>
                {/* Waves */}
                <path d="M-20,55 Q10,45 40,55 Q70,65 100,55 Q130,45 160,55 Q130,45 100,55 Q70,65 40,55 Q10,45 -20,55"
                  stroke="#5dade2" strokeWidth="2.5" fill="none" opacity="0.5"
                  style={{animation:"waveAnim 3s linear infinite"}}/>
                <path d="M-20,62 Q10,52 40,62 Q70,72 100,62 Q130,52 160,62"
                  stroke="#2e86c1" strokeWidth="2" fill="none" opacity="0.4"
                  style={{animation:"waveAnim 4s linear infinite reverse"}}/>
                {/* Main island */}
                <g style={{animation:"islandBob 3s ease-in-out infinite"}}>
                  <ellipse cx="45" cy="48" rx="18" ry="9" fill="#2ecc71"/>
                  <ellipse cx="45" cy="45" rx="14" ry="6" fill="#27ae60"/>
                  {/* Palm trees */}
                  <rect x="44" y="30" width="2.5" height="14" fill="#8b6914"/>
                  <ellipse cx="45" cy="29" rx="8" ry="4" fill="#1a9e3f" style={{transform:"rotate(-15deg)",transformOrigin:"45px 29px"}}/>
                  <ellipse cx="45" cy="29" rx="8" ry="3" fill="#27ae60" style={{transform:"rotate(15deg)",transformOrigin:"45px 29px"}}/>
                  <circle cx="47" cy="33" r="1.5" fill="#f39c12"/>
                </g>
                {/* Small island 2 */}
                <g style={{animation:"islandBob 4s ease-in-out infinite 0.5s"}}>
                  <ellipse cx="85" cy="42" rx="12" ry="6" fill="#2ecc71"/>
                  <ellipse cx="85" cy="40" rx="9" ry="4" fill="#27ae60"/>
                  <rect x="84" y="28" width="2" height="12" fill="#8b6914"/>
                  <ellipse cx="85" cy="27" rx="6" ry="3" fill="#1a9e3f"/>
                </g>
                {/* Coral underwater */}
                {[20,50,70,100].map((x,i)=>(
                  <g key={i} opacity="0.4">
                    <path d={`M${x},78 L${x-3},70 M${x},78 L${x+3},70 M${x},78 L${x},68`} stroke="#e74c3c" strokeWidth="1.5"/>
                  </g>
                ))}
                {/* Fishes */}
                {[30,65,95].map((x,i)=>(
                  <g key={i} style={{animation:`cloudDrift ${3+i}s ease-in-out infinite`,animationDelay:`${i*0.5}s`}}>
                    <ellipse cx={x} cy={65+i*4} rx="4" ry="2.5" fill={["#f39c12","#e74c3c","#f7dc6f"][i]} opacity="0.7"/>
                    <polygon points={`${x-5},${65+i*4} ${x-8},${62+i*4} ${x-8},${68+i*4}`} fill={["#f39c12","#e74c3c","#f7dc6f"][i]} opacity="0.7"/>
                  </g>
                ))}
                <text x="60" y="87" textAnchor="middle" fontSize="8" fill="#d7bde2" fontFamily="Nunito" fontWeight="800">🏝 Islands</text>
              </svg>
            )
          },
        ];

        return (
          <div style={{ textAlign: "center", minHeight: 640, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-start", position: "relative", overflow: "hidden", borderRadius: 32, padding: 0 }}>
            <div className="cover-bg"></div>

            {/* Floating particles */}
            {[...Array(18)].map((_,i)=>(
              <div key={i} className="particle" style={{
                left: `${5 + (i*5.5)%95}%`,
                bottom: `-10px`,
                width: `${3+i%4}px`,
                height: `${3+i%4}px`,
                borderRadius: "50%",
                background: ["#1cc58a","#f7dc6f","#5dade2","#82e0aa","#f0b27a"][i%5],
                opacity: 0.5 + (i%3)*0.15,
                animationDuration: `${4+i*0.7}s`,
                animationDelay: `${i*0.4}s`,
              }}/>
            ))}

            {/* India map outline — decorative */}
            <div style={{ position: "absolute", right: -20, top: 30, opacity: 0.10, pointerEvents: "none", zIndex: 1 }}>
              <svg width="240" height="300" viewBox="0 0 260 320" style={{animation:"countryOutline 5s ease-in-out infinite"}}>
                <path d="M130,10 L180,20 L220,60 L230,110 L210,160 L240,200 L220,240 L190,270 L160,300 L130,310 L100,300 L70,270 L50,240 L30,200 L60,160 L40,110 L50,60 L90,20 Z" stroke="#9be7a7" strokeWidth="2.5" fill="rgba(28,197,138,0.04)"/>
              </svg>
            </div>

            {/* Top spacer — let the forest breathe at the top */}
            <div style={{ height: 52, position: "relative", zIndex: 10, width: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <div style={{ fontSize: 11, letterSpacing: 5, color: "rgba(155,231,167,0.9)", textTransform: "uppercase",
                background: "rgba(10,40,20,0.55)", border: "1px solid rgba(155,231,167,0.25)",
                borderRadius: 100, padding: "6px 22px", backdropFilter: "blur(8px)" }}>
                ✦ Interactive Digital Book · Grade 7 ✦
              </div>
            </div>

            {/* Title card — glassmorphic over forest */}
            <div className="cover-title-card" style={{ width: "calc(100% - 32px)", maxWidth: 720 }}>

              {/* Chapter label */}
              <div style={{ fontSize: 11, letterSpacing: 4, color: "#9be7a7", textTransform: "uppercase", marginBottom: 14, opacity: 0.9, display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
                <span style={{ display: "inline-block", width: 28, height: 1, background: "rgba(155,231,167,0.5)" }}></span>
                Social Science · CBSE
                <span style={{ display: "inline-block", width: 28, height: 1, background: "rgba(155,231,167,0.5)" }}></span>
              </div>

              {/* Main title */}
              <h1 style={{
                fontFamily: "'Cinzel', serif",
                fontSize: "clamp(24px, 4.5vw, 50px)",
                fontWeight: 900,
                margin: "0 0 6px",
                lineHeight: 1.12,
                background: "linear-gradient(135deg, #f0fdf4 0%, #a7f3d0 40%, #f7dc6f 80%, #fbbf24 100%)",
                WebkitBackgroundClip: "text",
                WebkitTextFillColor: "transparent",
                backgroundSize: "200% auto",
                animation: "shimmerLine 5s linear infinite",
                textShadow: "none",
                letterSpacing: "0.5px",
              }}>
                {editMode ? (
                  <input value={displayTitle} onChange={e => updateEdit("title", e.target.value)} className="edit-border"
                    style={{ fontFamily: "inherit", fontSize: "inherit", fontWeight: "inherit", background: "rgba(255,255,255,0.08)", border: "2px dashed #9be7a7", borderRadius: 12, color: "#f7f9eb", padding: "6px 14px", width: "100%", textAlign: "center", WebkitTextFillColor: "#ebf9f1" }}/>
                ) : displayTitle}
              </h1>

              {/* Decorative underline */}
              <div style={{ width: 80, height: 3, margin: "12px auto 18px", borderRadius: 2,
                background: "linear-gradient(90deg, transparent, #1cc58a, #f7dc6f, transparent)" }}/>

              {/* Description */}
              <p style={{ color: "rgba(220,255,235,0.82)", fontSize: 14, lineHeight: 1.85, margin: "0 0 0", textAlign: "center", maxWidth: 540, marginLeft: "auto", marginRight: "auto" }}>
                {page.description}
              </p>

            </div>

            {/* Animated 5 Physical Divisions */}
            <div style={{ width: "100%", padding: "22px 16px 16px", position: "relative", zIndex: 10 }}>
              <div style={{ fontSize: 10, color: "rgba(155,231,167,0.75)", letterSpacing: 3, textTransform: "uppercase", marginBottom: 14, display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
                <span style={{ width: 20, height: 1, background: "rgba(155,231,167,0.4)", display: "inline-block" }}/>
                The 5 Physical Divisions of India
                <span style={{ width: 20, height: 1, background: "rgba(155,231,167,0.4)", display: "inline-block" }}/>
              </div>
              <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
                {divisions.map((div, i) => (
                  <div key={div.id}
                    style={{
                      width: 128, height: 108,
                      borderRadius: 16,
                      border: `2px solid ${div.color}55`,
                      background: `radial-gradient(ellipse at top, ${div.color}20, rgba(0,0,0,0.55))`,
                      backdropFilter: "blur(6px)",
                      overflow: "hidden",
                      cursor: "pointer",
                      transition: "transform 0.3s, box-shadow 0.3s",
                      animationDelay: div.delay,
                      boxShadow: `0 4px 20px rgba(0,0,0,0.4), 0 0 0 1px ${div.color}20`,
                    }}
                    className="menu-card-pop"
                    onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-7px) scale(1.06)"; e.currentTarget.style.boxShadow = `0 16px 36px rgba(0,0,0,0.5), 0 0 0 2px ${div.color}70`; }}
                    onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0) scale(1)"; e.currentTarget.style.boxShadow = `0 4px 20px rgba(0,0,0,0.4), 0 0 0 1px ${div.color}20`; }}
                    onClick={() => goToPage(7 + i)}
                  >
                    {div.svg}
                  </div>
                ))}
              </div>
            </div>

            {/* Buttons row */}
            <div style={{ display: "flex", gap: 16, alignItems: "center", position: "relative", zIndex: 10, marginBottom: 40, flexWrap: "wrap", justifyContent: "center" }}>
              {/* Voice Note Button */}
              <button
                onClick={speakWelcome}
                className={voicePlaying ? "voice-btn-pulse" : ""}
                style={{
                  background: voicePlaying ? "linear-gradient(135deg,#e74c3c,#c0392b)" : "rgba(5,35,18,0.65)",
                  border: `2px solid ${voicePlaying ? "#e74c3c" : "rgba(28,197,138,0.6)"}`,
                  borderRadius: 999,
                  padding: "14px 28px",
                  color: voicePlaying ? "#fff" : "#9be7a7",
                  fontSize: 15,
                  fontWeight: 800,
                  display: "flex",
                  alignItems: "center",
                  gap: 9,
                  backdropFilter: "blur(8px)",
                  transition: "all 0.3s",
                }}
              >
                <span style={{ fontSize: 20 }}>{voicePlaying ? "⏹" : "🎙"}</span>
                {voicePlaying ? "Stop Voice" : "Listen to Intro"}
              </button>

              {/* Let's Start Button */}
              <button onClick={() => goToPage(1)} className="begin-glow-btn">
                Let's Start →
              </button>
            </div>

            {/* Voice feedback text */}
            {voiceText && (
              <div style={{ color: "#9be7a7", fontSize: 12, marginTop: -24, marginBottom: 16, opacity: 0.85, zIndex: 10, position: "relative" }}>
                {voiceText}
              </div>
            )}

          </div>
        );
    }  // end CoverPage

    // ─── MenuPage component ────────────────────────────────────────────────────
    function MenuPage({ goToPage, setShowDoubt }) {
      const [activeCard, setActiveCard] = React.useState(null);
      const [voiceCard, setVoiceCard] = React.useState(null);
      const synth = window.speechSynthesis;

        const menuItems = [
          { title: "Read Chapters", icon: "📖", color: "#3498db", glowColor: "rgba(52,152,219,0.5)", emoji: "📖",
            desc: "Explore all 6 chapters covering Geographical Diversity, Physical Divisions, Himalayas and more!",
            voice: "Read the chapters to learn about India's amazing geography. You will explore 6 exciting chapters about mountains, deserts, plains, and islands!" },
          { title: "Flashcards", icon: "🎴", color: "#9b59b6", glowColor: "rgba(155,89,182,0.5)", emoji: "🎴",
            desc: "12 quick-revision cards — perfect for last-minute exam prep!",
            voice: "Practice with 12 flashcards! Each card has a question on one side and a detailed answer on the other. Great for exam revision!" },
          { title: "Mind Map", icon: "🧠", color: "#1abc9c", glowColor: "rgba(26,188,156,0.5)", emoji: "🧠",
            desc: "Visual concept map connecting all key topics in one place.",
            voice: "The mind map shows all topics connected visually. Click on any bubble to see details about that topic!" },
          { title: "Chapter Quiz", icon: "❓", color: "#e74c3c", glowColor: "rgba(231,76,60,0.5)", emoji: "❓",
            desc: "10-question chapter-wise quiz to test your knowledge!",
            voice: "Take the chapter quiz! There are 10 multiple choice questions to test what you have learned. Can you score 100 percent?" },
          { title: "Learn With Fun", icon: "🎮", color: "#f39c12", glowColor: "rgba(243,156,18,0.5)", emoji: "🎮",
            desc: "Fill-in-blanks, match-pairs, true/false and word games!",
            voice: "Learn with fun activities! Fill in the blanks, match the pairs, decide true or false, and unscramble words about India's geography!" },
          { title: "Ask Doubt", icon: "💬", color: "#27ae60", glowColor: "rgba(39,174,96,0.5)", emoji: "💬",
            desc: "Ask your AI Geography Teacher any question you have!",
            voice: "Ask your AI teacher any question! Type your doubt and get a clear, friendly explanation instantly from your AI Geography teacher!" },
        ];

        const speakCard = (item, idx) => {
          if (synth.speaking) { synth.cancel(); if (voiceCard === idx) { setVoiceCard(null); return; } }
          setVoiceCard(idx);
          const msg = new SpeechSynthesisUtterance(item.voice);
          msg.rate = 0.93; msg.pitch = 1.05;
          msg.onend = () => setVoiceCard(null);
          synth.speak(msg);
        };

        return (
          <div style={{ padding: "28px 16px", textAlign: "center" }}>
            {/* Header */}
            <div style={{ marginBottom: 28 }}>
              <div style={{ fontSize: 11, letterSpacing: 4, color: "#9be7a7", textTransform: "uppercase", marginBottom: 10, opacity: 0.8 }}>Your Learning Dashboard</div>
              <h2 style={{ color: "#f7dc6f", margin: 0, fontFamily: "'Cinzel', serif", fontSize: "clamp(22px,4vw,32px)", fontWeight: 700,
                textShadow: "0 0 30px rgba(247,220,111,0.4)" }}>Explore Your Learning Path</h2>
              <p style={{ color: "rgba(255,255,255,0.55)", fontSize: 13, marginTop: 8, marginBottom: 0 }}>
                Tap the 🎙 icon on any card to hear what's inside!
              </p>
            </div>

            {/* Menu grid */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 16, maxWidth: 860, margin: "0 auto" }}>
              {menuItems.map((item, i) => (
                <div key={i}
                  className="menu-card-pop"
                  style={{ animationDelay: `${i * 0.07}s` }}
                >
                  <div
                    onClick={() => {
                      if (item.title === "Read Chapters") goToPage(6);
                      else if (item.title === "Flashcards") goToPage(2);
                      else if (item.title === "Mind Map") goToPage(4);
                      else if (item.title === "Chapter Quiz") goToPage(3);
                      else if (item.title === "Learn With Fun") goToPage(5);
                      else setShowDoubt(true);
                    }}
                    onMouseEnter={() => setActiveCard(i)}
                    onMouseLeave={() => setActiveCard(null)}
                    style={{
                      background: `linear-gradient(145deg, ${item.color}22, ${item.color}10)`,
                      border: `2px solid ${activeCard === i ? item.color : item.color + "55"}`,
                      borderRadius: 20,
                      padding: "22px 18px 16px",
                      cursor: "pointer",
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      gap: 8,
                      boxShadow: activeCard === i ? `0 0 40px ${item.glowColor}, 0 8px 24px rgba(0,0,0,0.4)` : `0 4px 16px rgba(0,0,0,0.3)`,
                      transition: "all 0.3s ease",
                      transform: activeCard === i ? "translateY(-6px) scale(1.03)" : "scale(1)",
                      position: "relative",
                      textAlign: "center",
                    }}
                  >
                    {/* Voice button */}
                    <button
                      onClick={e => { e.stopPropagation(); speakCard(item, i); }}
                      style={{
                        position: "absolute", top: 10, right: 10,

                <div style={{ color: "#f7dc6f", fontSize: 13, marginBottom: 8, fontWeight: 700 }}>✏️ My Notes</div>

                  style={{ width: "100%", background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, padding: "10px 12px", color: "#e8f4fd", fontSize: 14, resize: "vertical", outline: "none", fontFamily: "inherit" }}

              />

      }

      return null;
    }

    // ─── Chapter Animation Component ──────────────────────────────────────────
    function ChapterAnimation({ scene }) {
      const [tick, setTick] = React.useState(0);
      // All state hoisted here — hooks must not be inside conditionals
      const [activeZone, setActiveZone] = React.useState(null);
      const [phase, setPhase] = React.useState(0);
      const [activeRange, setActiveRange] = React.useState(null);
      const [activeRole, setActiveRole] = React.useState(null);

      React.useEffect(() => {
        const id = setInterval(() => setTick(t => t + 1), 60);
        return () => clearInterval(id);
      }, []);

      // ── Scene 1: Geographical Diversity — India panorama with all 5 zones ──
      if (scene === "diversity") {
        const t = tick * 0.018;
        // Animated sun rays
        const rays = Array.from({length: 8}, (_, i) => {
          const angle = (i / 8) * Math.PI * 2 + t;
          return { x1: 760 + Math.cos(angle)*18, y1: 52 + Math.sin(angle)*18, x2: 760 + Math.cos(angle)*32, y2: 52 + Math.sin(angle)*32 };
        });
        // River sine wave
        const riverPts = Array.from({length: 30}, (_, i) => {
          const x = 260 + i * 17;
          const y = 118 + Math.sin(i * 0.55 + t * 2) * 7;
          return `${x},${y}`;
        }).join(" ");
        // Clouds drift
        const c1x = 100 + ((t * 18) % 180);
        const c2x = 320 + ((t * 12) % 200);
        // Wheat stalks sway
        const sway = Math.sin(t * 1.8) * 3;
        // Bird positions
        const b1x = 60 + ((t * 22) % 720);
        const b2x = 200 + ((t * 16) % 680);

        return (
          <div style={{ marginBottom: 20, borderRadius: 20, overflow: "hidden", border: "2px solid rgba(247,220,111,0.25)", boxShadow: "0 8px 32px rgba(0,0,0,0.4)" }}>
            <div style={{ background: "rgba(26,82,118,0.5)", padding: "8px 16px 4px", display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 16 }}>🌍</span>
              <span style={{ fontSize: 12, color: "#f7dc6f", fontWeight: 700, letterSpacing: 1 }}>INDIA — A LAND OF DIVERSE LANDSCAPES</span>
            </div>
            <svg viewBox="0 0 820 200" style={{ width: "100%", display: "block", background: "linear-gradient(180deg,#0d2137 0%,#1a3a5c 100%)" }}>
              <defs>
                <linearGradient id="skyDiv" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#0a1f3a"/><stop offset="100%" stopColor="#1a3a6c"/></linearGradient>
                <linearGradient id="snowDiv" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#eaf4fb"/><stop offset="100%" stopColor="#aed6f1"/></linearGradient>
                <linearGradient id="grassDiv" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#27ae60"/><stop offset="100%" stopColor="#1a7a42"/></linearGradient>

                <text x="325" y="178" fontSize="8" fill="#aed6f1" fontFamily="Nunito" fontWeight="700">Gangotri</text>
                <text x="325" y="187" fontSize="7" fill="#aed6f1" fontFamily="Nunito" opacity="0.7">Glacier</text>

                {/* Eagle */}
                <g transform={`translate(${eagleX},${eagleY})`}>
                  {eagleFlap
                    ? <path d="M0,0 L-14,-8 L-4,0 L4,0 L14,-8 Z" fill="#c8a96c" opacity="0.85"/>
                    : <path d="M0,0 L-14,3 L-4,0 L4,0 L14,3 Z" fill="#c8a96c" opacity="0.85"/>
                  }
                  <path d="M4,0 L10,2 L8,0 Z" fill="#e59866"/>
                </g>

                {/* River flowing from glacier */}
                {Array.from({length:6}, (_,i) => (
                  <circle key={i} cx={350 + Math.sin(t*2+i) * 8} cy={175 + i*5} r="2" fill="#5dade2" opacity={0.5 - i*0.06}/>
                ))}

                {/* Info tags */}
                {[
                  { x: 130, y: 185, label: "Shiwalik Range", color: "#f0b27a", sub: "900–1,200m" },
                  { x: 400, y: 170, label: "Himachal Range", color: "#82e0aa", sub: "3,700–4,500m" },
                  { x: 680, y: 155, label: "Himadri Range", color: "#85c1e9", sub: "Above 6,000m" },
                ].map(tag => (
                  <g key={tag.label}>
                    <rect x={tag.x-40} y={tag.y} width="85" height="22" rx="5" fill="rgba(0,0,0,0.55)"/>
                    <text x={tag.x+2} y={tag.y+9} textAnchor="middle" fontSize="7.5" fill={tag.color} fontWeight="800" fontFamily="Nunito">{tag.label}</text>
                    <text x={tag.x+2} y={tag.y+18} textAnchor="middle" fontSize="6.5" fill={tag.color} fontFamily="Nunito" opacity="0.8">{tag.sub}</text>
                  </g>
                ))}
              </svg>
            ) : (
              // Plate collision animation
              <svg viewBox="0 0 820 220" style={{ width: "100%", display: "block" }}>
                <defs>
                  <linearGradient id="plateA" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stopColor="#1a5276"/><stop offset="100%" stopColor="#2980b9"/></linearGradient>
                  <linearGradient id="plateB" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stopColor="#784212"/><stop offset="100%" stopColor="#a04000"/></linearGradient>
                </defs>
                <rect width="820" height="220" fill="#0a1520"/>
                {/* Labels */}
                <text x="160" y="30" textAnchor="middle" fontSize="13" fill="#85c1e9" fontWeight="900" fontFamily="Nunito">Indo-Australian Plate</text>
                <text x="650" y="30" textAnchor="middle" fontSize="13" fill="#f0b27a" fontWeight="900" fontFamily="Nunito">Eurasian Plate</text>
                {/* Arrow */}
                <text x="410" y="100" textAnchor="middle" fontSize="11" fill="#f7dc6f" fontWeight="700" fontFamily="Nunito">💥 Collision ~50 Million Years Ago</text>
                {/* Plate A moving right */}
                <rect x={50 + Math.sin(t) * 5} y="110" width="310" height="60" rx="10" fill="url(#plateA)" opacity="0.9"/>
                <text x={200 + Math.sin(t)*5} y="147" textAnchor="middle" fontSize="11" fill="white" fontWeight="800" fontFamily="Nunito">India →</text>
                {/* Plate B moving left */}
                <rect x={460 + Math.sin(t+Math.PI) * 5} y="110" width="310" height="60" rx="10" fill="url(#plateB)" opacity="0.9"/>
                <text x={620+Math.sin(t+Math.PI)*5} y="147" textAnchor="middle" fontSize="11" fill="white" fontWeight="800" fontFamily="Nunito">← Eurasia</text>
                {/* Mountain rising from collision */}
                <polygon points={`${370+Math.sin(t)*3},110 ${410},${50+Math.cos(t*0.5)*8} ${450+Math.sin(t)*3},110`} fill="#85c1e9" opacity="0.9"/>
                <polygon points={`${390+Math.sin(t)*2},110 ${410},${55+Math.cos(t*0.5)*8} ${430+Math.sin(t)*2},110`} fill="white" opacity="0.85"/>
                <text x="410" y="192" textAnchor="middle" fontSize="10" fill="#82e0aa" fontFamily="Nunito" fontWeight="700">Result: The Himalayan Mountains — still growing 5mm/year!</text>
                {/* Arrows showing movement */}
                <path d="M320,140 L365,140" stroke="#f7dc6f" strokeWidth="2.5" markerEnd="url(#arr)"/>
                <path d="M500,140 L455,140" stroke="#f7dc6f" strokeWidth="2.5"/>
                <polygon points="365,136 375,140 365,144" fill="#f7dc6f"/>
                <polygon points="455,136 445,140 455,144" fill="#f7dc6f"/>
              </svg>
            )}

            <div style={{ background: "rgba(44,62,80,0.6)", padding: "8px 16px", display: "flex", gap: 20, flexWrap: "wrap", justifyContent: "center" }}>
              {[["📏","2,400 km long","#85c1e9"],["🏔","8,848m — Everest","#f7dc6f"],["🌍","Spans 6 Nations","#82e0aa"],["❄","3 Glacier-fed Rivers","#aed6f1"]].map(([icon,label,color])=>(
                <div key={label} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color, fontWeight: 700 }}><span>{icon}</span><span>{label}</span></div>
              ))}
            </div>
          </div>
        );
      }

      // ── Scene 4: Three Ranges — cross-section with animated elements ──
      if (scene === "three-ranges") {
        const t = tick * 0.02;

        // Climber bobbing on Himadri peak
        const climberY = 62 + Math.abs(Math.sin(t * 0.6)) * 10;
        const climberX = 205 + Math.sin(t * 0.35) * 6;

        // Deer in Shiwalik
        const deerX = 665 + Math.sin(t * 0.55) * 18;

        // Cloud drifting over Himachal
        const cloudX = 420 + Math.sin(t * 0.4) * 30;

        // Snowflakes near Himadri peak
        const flakes = [
          { x: 160, y: 55 }, { x: 195, y: 40 }, { x: 230, y: 62 },
          { x: 175, y: 80 }, { x: 215, y: 78 },
        ].map((f, i) => ({
          x: f.x + Math.sin(t * 1.2 + i * 1.1) * 4,
          y: f.y + Math.cos(t * 0.9 + i * 0.8) * 5,
        }));

        // Range click areas (mapped to viewBox x-coordinates)
        const rangeZones = { himadri: [60, 310], himachal: [310, 550], shiwalik: [550, 820] };
        const handleRangeClick = (e) => {
          const rect = e.currentTarget.getBoundingClientRect();
          const svgX = ((e.clientX - rect.left) / rect.width) * 820;
          if (svgX >= 60 && svgX < 310) setActiveRange(activeRange === "himadri" ? null : "himadri");
          else if (svgX >= 310 && svgX < 550) setActiveRange(activeRange === "himachal" ? null : "himachal");
          else if (svgX >= 550) setActiveRange(activeRange === "shiwalik" ? null : "shiwalik");
          else setActiveRange(null);
        };

        const rangeInfo = {
          himadri: {
            title: "Himadri — Greater Himalayas",
            color: "#85c1e9",
            facts: [
              "Highest & innermost range",
              "Altitude: above 6,000 m",
              "Always snow-covered",
              "Mt. Everest (8,848 m) & Kanchenjunga",
              "Gangotri Glacier — source of Ganga",
            ],
          },
          himachal: {
            title: "Himachal — Lesser Himalayas",
            color: "#82e0aa",
            facts: [
              "Middle range",
              "Altitude: 3,700 – 4,500 m",
              "Famous hill stations: Shimla, Mussoorie",
              "Darjeeling & Nainital also here",
              "Dense forests & rich biodiversity",
            ],
          },
          shiwalik: {
            title: "Shiwalik — Outer Foothills",
            color: "#f0b27a",
            facts: [
              "Lowest & outermost range",
              "Altitude: 900 – 1,200 m",
              "Also called Outer Himalayas",
              "Cities: Dehradun, Haridwar",
              "Transitions into the Northern Plains",
            ],
          },
        };

        const active = activeRange ? rangeInfo[activeRange] : null;

        return (
          <div style={{ marginBottom: 20, borderRadius: 20, overflow: "hidden", border: "2px solid rgba(240,178,122,0.35)", boxShadow: "0 8px 32px rgba(0,0,0,0.45)" }}>

            {/* Header */}
            <div style={{ background: "rgba(74,35,90,0.65)", padding: "9px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 6 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 18 }}>🗻</span>
                <span style={{ fontSize: 12, color: "#f0b27a", fontWeight: 800, letterSpacing: 1 }}>THREE RANGES OF THE HIMALAYAS</span>
              </div>
              <span style={{ fontSize: 10, color: "rgba(255,255,255,0.45)", fontStyle: "italic" }}>Tap any mountain range to explore it</span>
            </div>

            {/* Main SVG scene */}
            <svg viewBox="0 0 820 250" style={{ width: "100%", display: "block", cursor: "pointer" }}
              onClick={handleRangeClick}>

              <defs>
                <linearGradient id="skyTR" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#07111f"/>
                  <stop offset="70%" stopColor="#112240"/>
                  <stop offset="100%" stopColor="#1a3a5c"/>
                </linearGradient>
                <linearGradient id="himadriG" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={activeRange === "himadri" ? "#2e6b96" : "#1a3055"}/>
                  <stop offset="100%" stopColor={activeRange === "himadri" ? "#1e4a70" : "#0e1e38"}/>
                </linearGradient>
                <linearGradient id="himachalG" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={activeRange === "himachal" ? "#2d6e45" : "#1e4a2e"}/>
                  <stop offset="100%" stopColor={activeRange === "himachal" ? "#1a4a2a" : "#0f2c1a"}/>
                </linearGradient>
                <linearGradient id="shiwalikG" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={activeRange === "shiwalik" ? "#a05830" : "#7a3e18"}/>
                  <stop offset="100%" stopColor={activeRange === "shiwalik" ? "#7a3e18" : "#4a2408"}/>
                </linearGradient>
                <linearGradient id="plainsGTR" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#2ecc71"/>
                  <stop offset="100%" stopColor="#1a7a42"/>
                </linearGradient>
                <filter id="softShadow"><feDropShadow dx="0" dy="3" stdDeviation="4" floodColor="rgba(0,0,0,0.5)"/></filter>
              </defs>

              {/* Sky */}
              <rect width="820" height="250" fill="url(#skyTR)"/>

              {/* Stars */}
              {[30,90,155,230,310,490,560,640,720,790].map((sx, i) => (
                <circle key={i} cx={sx} cy={[12,7,15,9,5,11,17,8,13,6][i]} r="0.9"
                  fill="white" opacity={0.35 + Math.sin(t * 1.4 + i) * 0.25}/>
              ))}

              {/* Moon */}
              <circle cx="760" cy="32" r="18" fill="#e8e8d0" opacity="0.85"/>
              <circle cx="768" cy="27" r="14" fill="#112240" opacity="0.7"/>

              {/* ── RANGE 1: HIMADRI — leftmost, tallest ── */}
              <polygon
                points="0,250 0,175 60,148 100,165 140,130 180,150 210,80 240,105 270,125 310,148 310,250"
                fill="url(#himadriG)"
                opacity={activeRange && activeRange !== "himadri" ? 0.35 : 1}
                style={{ transition: "opacity 0.3s" }}
              />
              {/* Snow cap on Himadri */}
              <polygon points="210,80 240,110 180,110"
                fill="white" opacity={activeRange && activeRange !== "himadri" ? 0.15 : 0.95}/>
              <polygon points="140,130 162,148 118,148"
                fill="white" opacity={activeRange && activeRange !== "himadri" ? 0.1 : 0.7}/>
              {/* Glacier line */}
              <path d="M225,100 Q220,118 215,135 Q210,152 205,168"
                stroke="#aed6f1" strokeWidth="2.5" fill="none"
                opacity={activeRange && activeRange !== "himadri" ? 0.1 : 0.65}
                strokeLinecap="round"/>
              <text x="182" y="173" fontSize="7" fill="#aed6f1" fontFamily="Nunito" fontWeight="700"
                opacity={activeRange && activeRange !== "himadri" ? 0.1 : 0.7}>Gangotri →</text>

              {/* Snowflakes near Himadri peak */}
              {(activeRange === null || activeRange === "himadri") && flakes.map((f, i) => (
                <text key={i} x={f.x} y={f.y} fontSize="7" fill="white" opacity="0.55"
                  textAnchor="middle">❄</text>
              ))}

              {/* Animated climber on Himadri */}
              <g transform={`translate(${climberX}, ${climberY})`}
                opacity={activeRange && activeRange !== "himadri" ? 0.15 : 1}>
                {/* Head */}
                <circle cx="0" cy="-9" r="4" fill="#f5cba7"/>
                {/* Helmet */}
                <ellipse cx="0" cy="-12" rx="4.5" ry="2.5" fill="#e74c3c"/>
                {/* Body */}
                <rect x="-3.5" y="-5" width="7" height="10" rx="2" fill="#3498db"/>
                {/* Legs */}
                <rect x="-3.5" y="5" width="3" height="7" rx="1" fill="#2c3e50"/>
                <rect x="0.5" y="5" width="3" height="7" rx="1" fill="#2c3e50"/>
                {/* Arms */}
                <line x1="-3.5" y1="-2" x2="-9" y2="4" stroke="#f5cba7" strokeWidth="1.8"/>
                <line x1="3.5" y1="-2" x2="9" y2="4" stroke="#f5cba7" strokeWidth="1.8"/>
                {/* Ice axe */}
                <line x1="9" y1="4" x2="14" y2="-2" stroke="#888" strokeWidth="1.5"/>
                <rect x="10" y="-3" width="8" height="2.5" rx="1" fill="#555" transform="rotate(-35,14,-2)"/>
                {/* Flag on peak nearby */}
                <line x1="18" y1="-18" x2="18" y2="-5" stroke="#f7dc6f" strokeWidth="1.2"/>
                <polygon points="18,-18 28,-14 18,-10" fill="#e74c3c" opacity="0.9"/>
              </g>

              {/* Everest label */}
              <g opacity={activeRange && activeRange !== "himadri" ? 0.15 : 0.9}>
                <rect x="215" y="66" width="105" height="16" rx="4" fill="rgba(0,0,0,0.65)"/>
                <text x="267" y="78" textAnchor="middle" fontSize="8" fill="#f7dc6f" fontWeight="900" fontFamily="Nunito">🏔 Everest 8,848m</text>
              </g>

              {/* ── RANGE 2: HIMACHAL — middle ── */}
              <polygon
                points="310,250 310,165 340,145 375,160 410,120 445,138 480,108 510,125 550,148 550,250"
                fill="url(#himachalG)"
                opacity={activeRange && activeRange !== "himachal" ? 0.35 : 1}
                style={{ transition: "opacity 0.3s" }}
              />
              {/* Pine trees on Himachal */}
              {[320,340,360,382,402,422,445,468,492,515,535].map((px, i) => (
                <g key={i} opacity={activeRange && activeRange !== "himachal" ? 0.15 : 0.9}>
                  <polygon points={`${px},${132+i%3*6} ${px-7},${146+i%3*6} ${px+7},${146+i%3*6}`} fill="#1a5c2a"/>
                  <polygon points={`${px},${126+i%3*6} ${px-5},${137+i%3*6} ${px+5},${137+i%3*6}`} fill="#27ae60" opacity="0.85"/>
                  <rect x={px-1.5} y={146+i%3*6} width="3" height="5" fill="#5d4037"/>
                </g>
              ))}
              {/* Hill station (Shimla) */}
              <g opacity={activeRange && activeRange !== "himachal" ? 0.1 : 0.9}>
                <rect x="468" y="109" width="16" height="11" fill="#dce8f0"/>
                <polygon points="465,109 487,109 476,100" fill="#c0392b"/>
                <rect x="472" y="113" width="5" height="7" fill="#7f8c8d"/>
                <rect x="469" y="112" width="4" height="3" fill="#85c1e9"/>
                <text x="476" y="130" textAnchor="middle" fontSize="7.5" fill="#82e0aa" fontFamily="Nunito" fontWeight="800">Shimla</text>
              </g>
              {/* Cloud over Himachal */}
              <g opacity={activeRange && activeRange !== "himachal" ? 0.1 : 0.5}>
                <ellipse cx={cloudX} cy="92" rx="28" ry="10" fill="white"/>
                <ellipse cx={cloudX - 15} cy="96" rx="18" ry="9" fill="white"/>
                <ellipse cx={cloudX + 14} cy="95" rx="16" ry="8" fill="#e8f0f4"/>
              </g>

              {/* ── RANGE 3: SHIWALIK — rightmost, lowest ── */}
              <polygon
                points="550,250 550,172 580,158 610,168 640,150 668,162 700,145 730,156 760,148 790,158 820,152 820,250"
                fill="url(#shiwalikG)"
                opacity={activeRange && activeRange !== "shiwalik" ? 0.35 : 1}
                style={{ transition: "opacity 0.3s" }}
              />
              {/* Broad-leaf trees on Shiwalik */}
              {[560,582,605,628,650,672,696,720,745,768,792,814].map((px, i) => (
                <g key={i} opacity={activeRange && activeRange !== "shiwalik" ? 0.15 : 0.9}>
                  <rect x={px-1.5} y={148+i%2*5} width="3" height="12" fill="#6d4c2e"/>
                  <circle cx={px} cy={144+i%2*5} r={6+i%3} fill="#2d7a2d" opacity="0.9"/>
                  <circle cx={px+3} cy={141+i%2*5} r={4+i%2} fill="#3aaa50" opacity="0.7"/>
                </g>
              ))}
              {/* Animated deer */}
              <g transform={`translate(${deerX}, 164)`}
                opacity={activeRange && activeRange !== "shiwalik" ? 0.15 : 1}>
                <ellipse cx="0" cy="0" rx="10" ry="5.5" fill="#c8a96c"/>
                <ellipse cx="-7" cy="-4" rx="5" ry="7" fill="#c8a96c"/>
                <circle cx="-8" cy="-9" r="4" fill="#c8a96c"/>
                <rect x="-11" y="5" width="3" height="8" rx="1.5" fill="#b8945c"/>
                <rect x="-6" y="5" width="3" height="8" rx="1.5" fill="#b8945c"/>
                <rect x="2" y="5" width="3" height="8" rx="1.5" fill="#b8945c"/>
                <rect x="7" y="5" width="3" height="8" rx="1.5" fill="#b8945c"/>
                {/* Antlers */}
                <line x1="-8" y1="-12" x2="-12" y2="-18" stroke="#b8945c" strokeWidth="1.5"/>
                <line x1="-12" y1="-18" x2="-15" y2="-14" stroke="#b8945c" strokeWidth="1.2"/>
                <line x1="-8" y1="-12" x2="-5" y2="-18" stroke="#b8945c" strokeWidth="1.5"/>
                <line x1="-5" y1="-18" x2="-3" y2="-14" stroke="#b8945c" strokeWidth="1.2"/>
              </g>

              {/* ── Northern Plains at the bottom ── */}
              <rect x="0" y="210" width="820" height="40" fill="url(#plainsGTR)" opacity="0.85"/>
              {/* Crop rows on plains */}
              {[15,40,65,90,120,155,195,240,290,360,440,530,625,720,790].map((px, i) => (
                <g key={i}>
                  <rect x={px} y={207 + Math.sin(t + i) * 1.5} width="2.5" height="9" fill="#1a7a42"/>
                  <ellipse cx={px+1} cy={205 + Math.sin(t+i)*1.5} rx="3" ry="4" fill="#f7dc6f" opacity="0.8"/>
                </g>
              ))}
              <text x="410" y="238" textAnchor="middle" fontSize="9" fill="#82e0aa" fontWeight="800" fontFamily="Nunito">
                ↑ Northern Plains (flat, fertile — formed by river deposits)
              </text>

              {/* Range bottom labels */}
              {[
                { x: 155, label: "HIMADRI", sub: "Greater Himalayas • >6,000m", color: "#85c1e9", id: "himadri" },
                { x: 430, label: "HIMACHAL", sub: "Lesser Himalayas • 3,700–4,500m", color: "#82e0aa", id: "himachal" },
                { x: 685, label: "SHIWALIK", sub: "Outer Foothills • 900–1,200m", color: "#f0b27a", id: "shiwalik" },
              ].map(r => (
                <g key={r.id}>
                  <rect x={r.x - 70} y="190" width="140" height="20" rx="6"
                    fill={activeRange === r.id ? `${r.color}28` : "rgba(0,0,0,0.55)"}
                    stroke={activeRange === r.id ? r.color : `${r.color}40`} strokeWidth="1.2"/>
                  <text x={r.x} y="199" textAnchor="middle" fontSize="7.5" fill={r.color} fontWeight="900" fontFamily="Nunito">{r.label}</text>
                  <text x={r.x} y="207" textAnchor="middle" fontSize="6.5" fill={r.color} fontFamily="Nunito" opacity="0.75">{r.sub}</text>
                </g>
              ))}

              {/* Info panel — top-right when a range is active */}
              {active && (
                <g>
                  <rect x="530" y="8" width="282" height="145" rx="12"
                    fill="rgba(4,10,22,0.92)" stroke={active.color} strokeWidth="1.8"/>
                  {/* Title bar */}
