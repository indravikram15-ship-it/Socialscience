                  <rect x="530" y="8" width="282" height="26" rx="12" fill={`${active.color}25`}/>
                  <rect x="530" y="24" width="282" height="10" fill={`${active.color}25`}/>
                  <text x="671" y="25" textAnchor="middle" fontSize="9.5" fill={active.color} fontWeight="900" fontFamily="Nunito">{active.title}</text>
                  {active.facts.map((f, i) => (
                    <g key={i}>
                      <circle cx="546" cy={44 + i * 20} r="3" fill={active.color}/>
                      <text x="556" y={48 + i * 20} fontSize="8.5" fill="rgba(255,255,255,0.88)" fontFamily="Nunito">{f}</text>
                    </g>
                  ))}
                  {/* Close hint */}
                  <text x="671" y="148" textAnchor="middle" fontSize="7" fill="rgba(255,255,255,0.35)" fontFamily="Nunito">tap again to close</text>
                </g>
              )}

            </svg>

            {/* Legend footer */}
            <div style={{ background: "rgba(74,35,90,0.6)", padding: "8px 16px", display: "flex", gap: 20, justifyContent: "center", flexWrap: "wrap", alignItems: "center" }}>
              {[["#85c1e9","🏔 Himadri (Greater)"],["#82e0aa","🌲 Himachal (Lesser)"],["#f0b27a","🌳 Shiwalik (Outer)"]].map(([c, l]) => (
                <div key={l} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: c, fontWeight: 700 }}>
                  <div style={{ width: 10, height: 10, borderRadius: 2, background: c }}/>{l}
                </div>
              ))}
            </div>
          </div>
        );
      }

      // ── Scene 5: Importance of Himalayas — interactive rolecard animation ──
      if (scene === "importance") {
        const t = tick * 0.022;
        // Monsoon cloud movement
        const cloudX = 200 + ((tick * 0.6) % 280);
        const raindrops = Array.from({length: 8}, (_, i) => ({
          x: cloudX - 30 + i * 9,
          y: 100 + ((tick * 1.2 + i * 15) % 70),
          opacity: 0.5 + Math.sin(tick * 0.15 + i) * 0.3,
        }));

        const roles = [
          { id: "climate", icon: "🌧️", label: "Climate", color: "#82e0aa", cx: 160, cy: 90 },
          { id: "water", icon: "💧", label: "Water Source", color: "#5dade2", cx: 340, cy: 60 },
          { id: "defence", icon: "🛡️", label: "Defence", color: "#e74c3c", cx: 520, cy: 80 },
          { id: "bio", icon: "🦁", label: "Biodiversity", color: "#f0b27a", cx: 660, cy: 95 },
        ];

        return (
          <div style={{ marginBottom: 20, borderRadius: 20, overflow: "hidden", border: "2px solid rgba(130,224,170,0.25)", boxShadow: "0 8px 32px rgba(0,0,0,0.4)" }}>
            <div style={{ background: "rgba(26,82,118,0.55)", padding: "8px 16px 4px", display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 16 }}>⭐</span>
              <span style={{ fontSize: 12, color: "#82e0aa", fontWeight: 700, letterSpacing: 1 }}>IMPORTANCE OF THE HIMALAYAS — TAP AN ICON TO LEARN</span>
            </div>
            <svg viewBox="0 0 820 210" style={{ width: "100%", display: "block", cursor: "pointer" }}>
              <defs>
                <linearGradient id="skyImp" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#0a1d35"/><stop offset="100%" stopColor="#163252"/></linearGradient>
              </defs>
              <rect width="820" height="210" fill="url(#skyImp)"/>

              {/* Mountain silhouette background */}
              <polygon points="0,210 0,145 80,100 160,130 240,90 320,115 400,75 480,100 560,85 640,105 720,88 820,100 820,210" fill="#1a2740" opacity="0.9"/>
              {/* Snow caps */}
              <polygon points="240,90 268,112 212,112" fill="white" opacity="0.6"/>
              <polygon points="400,75 428,98 372,98" fill="white" opacity="0.65"/>
              <polygon points="560,85 582,105 538,105" fill="white" opacity="0.6"/>

              {/* CLIMATE: Monsoon cloud & rain */}
              <g onClick={() => setActiveRole(activeRole==="climate" ? null : "climate")} style={{ cursor: "pointer" }}>
                <ellipse cx={cloudX} cy="68" rx="35" ry="14" fill="#5d8aa8" opacity={activeRole==="climate" ? 0.9 : 0.65}/>
                <ellipse cx={cloudX-18} cy="72" rx="22" ry="12" fill="#5d8aa8" opacity={activeRole==="climate" ? 0.85 : 0.6}/>
                <ellipse cx={cloudX+18} cy="73" rx="20" ry="11" fill="#4a7a96" opacity={activeRole==="climate" ? 0.85 : 0.6}/>
                {raindrops.map((r,i) => (
                  <line key={i} x1={r.x} y1={r.y} x2={r.x-2} y2={r.y+8} stroke="#5dade2" strokeWidth="1.5" opacity={r.opacity}/>
                ))}
                {/* Cold wind arrow blocked */}
                <path d="M750,105 L690,105" stroke="#aed6f1" strokeWidth="2" strokeDasharray="6,3" opacity="0.7"/>
                <polygon points="695,101 685,105 695,109" fill="#aed6f1" opacity="0.7"/>
                <text x="755" y="102" fontSize="7.5" fill="#aed6f1" fontFamily="Nunito" fontWeight="700">Cold Arctic</text>
                <text x="755" y="111" fontSize="7.5" fill="#aed6f1" fontFamily="Nunito" fontWeight="700">Wind →</text>
                <text x="680" y="95" fontSize="8" fill="#e74c3c" fontWeight="900" fontFamily="Nunito">✗ BLOCKED</text>
              </g>

              {/* Role icons */}
              {roles.map(r => (
                <g key={r.id} onClick={() => setActiveRole(activeRole===r.id ? null : r.id)} style={{ cursor: "pointer" }}>
                  <circle cx={r.cx} cy={r.cy+100} r={activeRole===r.id ? 28 : 22}
                    fill={activeRole===r.id ? `${r.color}35` : "rgba(0,0,0,0.4)"}
                    stroke={r.color} strokeWidth={activeRole===r.id ? 2.5 : 1.5}
                    style={{ transition: "all 0.25s" }}/>
                  <text x={r.cx} y={r.cy+104} textAnchor="middle" fontSize="18">{r.icon}</text>
                  <text x={r.cx} y={r.cy+122} textAnchor="middle" fontSize="8" fill={r.color} fontWeight="800" fontFamily="Nunito">{r.label}</text>
                </g>
              ))}

              {/* Active role info */}
              {activeRole && (() => {
                const details = {
                  climate: { title: "Climate Control", body: "The Himalayas block freezing Arctic winds from reaching India, keeping winters mild. They also force monsoon clouds to rise and shed heavy rains over India.", color: "#82e0aa" },
                  water: { title: "Water Tower of Asia", body: "Himalayan glaciers store ice that melts and feeds the Ganga, Yamuna, Indus and Brahmaputra — providing water for agriculture and drinking to 600 million people.", color: "#5dade2" },
                  defence: { title: "Natural Defence Wall", body: "The Himalayas form a 2,400 km natural barrier that has historically protected India from invasions from the north and northeast.", color: "#e74c3c" },
                  bio: { title: "Biodiversity Hotspot", body: "Home to the snow leopard, red panda, Himalayan blue poppy, and thousands of rare plants and animals found nowhere else on Earth.", color: "#f0b27a" },
                }[activeRole];
                return (
                  <g>
                    <rect x="280" y="128" width="260" height="72" rx="12" fill="rgba(5,15,30,0.88)" stroke={details.color} strokeWidth="1.5"/>
                    <text x="410" y="148" textAnchor="middle" fontSize="9.5" fill={details.color} fontWeight="900" fontFamily="Nunito">{details.title}</text>
                    {details.body.match(/.{1,42}/g).map((line, i) => (
                      <text key={i} x="295" y={163+i*12} fontSize="7.8" fill="rgba(255,255,255,0.82)" fontFamily="Nunito">{line}</text>
                    ))}
                  </g>
                );
              })()}

              {/* Water / river flowing down */}
              {Array.from({length:6}, (_,i) => (
                <circle key={i} cx={410 + Math.sin(t*2+i*1.2)*12} cy={120+i*12} r="2.5" fill="#5dade2" opacity={0.5-i*0.06}/>
              ))}
              <text x="440" y="132" fontSize="7.5" fill="#5dade2" fontFamily="Nunito" opacity="0.7">River flows →</text>
            </svg>
            <div style={{ background: "rgba(26,82,118,0.55)", padding: "8px 16px", display: "flex", gap: 14, flexWrap: "wrap", justifyContent: "center" }}>
              {[["🌧️","Climate","#82e0aa"],["💧","Water Source","#5dade2"],["🛡️","Defence","#e74c3c"],["🦁","Biodiversity","#f0b27a"],["💰","Economy","#f7dc6f"],["🌍","Geo-boundary","#85c1e9"]].map(([icon,label,color])=>(
                <div key={label} style={{ fontSize: 10, color, fontWeight: 700 }}>{icon} {label}</div>
              ))}
            </div>
          </div>
        );
      }

      // ── Scene 6: Northern Plains — farming simulation with river systems ──
      if (scene === "plains") {
        const t = tick * 0.02;
        // River waves
        const riverY1 = (x) => 135 + Math.sin(x * 0.04 + t * 2) * 5;
        const riverY2 = (x) => 158 + Math.sin(x * 0.035 + t * 1.8 + 1) * 4;
        const riverPath1 = Array.from({length: 82}, (_, i) => `${i === 0 ? "M" : "L"}${i*10},${riverY1(i*10)}`).join(" ");
        const riverPath2 = Array.from({length: 82}, (_, i) => `${i === 0 ? "M" : "L"}${i*10},${riverY2(i*10)}`).join(" ");
        // Farmer walking
        const farmerX = 80 + ((tick * 0.5) % 380);
        const legSwing = Math.sin(tick * 0.18) * 8;
        // Tractor
        const tractorX = 500 + ((tick * 0.35) % 250);
        // Crop sway
        const sway = Math.sin(t * 1.5) * 2.5;
        const regions = [
          { x: 0, w: 270, label: "Punjab Plains", color: "#f9e79f", crop: "Wheat 🌾", river: "Sutlej, Beas" },
          { x: 270, w: 310, label: "Ganga Plains", color: "#82e0aa", crop: "Rice & Wheat 🍚", river: "Ganga, Yamuna" },
          { x: 580, w: 240, label: "Brahmaputra Plains", color: "#85c1e9", crop: "Tea & Rice 🍵", river: "Brahmaputra" },
        ];

        return (
          <div style={{ marginBottom: 20, borderRadius: 20, overflow: "hidden", border: "2px solid rgba(130,224,170,0.25)", boxShadow: "0 8px 32px rgba(0,0,0,0.4)" }}>
            <div style={{ background: "rgba(30,132,73,0.5)", padding: "8px 16px 4px", display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 16 }}>🌾</span>
              <span style={{ fontSize: 12, color: "#82e0aa", fontWeight: 700, letterSpacing: 1 }}>THE NORTHERN PLAINS — GRANARY OF INDIA</span>
            </div>
            <svg viewBox="0 0 820 220" style={{ width: "100%", display: "block" }}>
              <defs>
                <linearGradient id="skyPl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#0d2137"/><stop offset="60%" stopColor="#1a3a5c"/><stop offset="100%" stopColor="#1e5c30"/></linearGradient>
                <linearGradient id="fieldPl" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#27ae60"/><stop offset="100%" stopColor="#1a6e38"/></linearGradient>
              </defs>
              <rect width="820" height="220" fill="url(#skyPl2)"/>

              {/* Sun */}
              <circle cx="760" cy="38" r="22" fill="#f7dc6f" opacity="0.9"/>
              <circle cx="760" cy="38" r="30" fill="#f7dc6f" opacity="0.12"/>
              {Array.from({length:8}, (_,i) => {
                const angle = i/8*Math.PI*2 + t*0.5;
                return <line key={i} x1={760+Math.cos(angle)*25} y1={38+Math.sin(angle)*25} x2={760+Math.cos(angle)*38} y2={38+Math.sin(angle)*38} stroke="#f7dc6f" strokeWidth="2" opacity="0.45"/>;
              })}

              {/* Himalayan silhouette as background */}
              <polygon points="0,95 50,60 110,78 170,52 230,70 290,48 350,64 410,40 470,58 530,45 590,62 650,48 710,60 770,50 820,55 820,110 0,110" fill="#1a2740" opacity="0.6"/>
              <polygon points="290,48 320,68 260,68" fill="white" opacity="0.5"/>
              <polygon points="410,40 440,62 380,62" fill="white" opacity="0.55"/>
              <text x="410" y="35" textAnchor="middle" fontSize="8" fill="rgba(133,193,233,0.7)" fontFamily="Nunito" fontWeight="700">← Himalayas (source of rivers)</text>

              {/* Ground */}
              <rect x="0" y="108" width="820" height="112" fill="url(#fieldPl)"/>

              {/* Region dividers */}
              <line x1="270" y1="108" x2="270" y2="220" stroke="rgba(255,255,255,0.15)" strokeWidth="1.5" strokeDasharray="4,3"/>
              <line x1="580" y1="108" x2="580" y2="220" stroke="rgba(255,255,255,0.15)" strokeWidth="1.5" strokeDasharray="4,3"/>

              {/* Region colour bands */}
              <rect x="0" y="108" width="270" height="112" fill="#d4a017" opacity="0.2"/>
              <rect x="270" y="108" width="310" height="112" fill="#27ae60" opacity="0.15"/>
              <rect x="580" y="108" width="240" height="112" fill="#5dade2" opacity="0.15"/>

              {/* Crops — wheat left */}
              {Array.from({length:27}, (_,i) => {
                const x = 8 + i*10;
                const sw = Math.sin(t*1.5+i*0.5)*sway;
                return (
                  <g key={i}>
                    <rect x={x+sw} y={104} width="2.5" height="14" fill="#d4a017" opacity="0.9"/>
                    <ellipse cx={x+sw+1} cy={102} rx="3" ry="5" fill="#f7dc6f" opacity="0.85"/>
                  </g>
                );
              })}
              {/* Crops — rice middle */}
              {Array.from({length:31}, (_,i) => {
                const x = 278 + i*10;
                const sw = Math.sin(t*1.2+i*0.4)*sway;
                return (
                  <g key={i}>
                    <rect x={x+sw} y={106} width="2.5" height="12" fill="#1a7a42" opacity="0.9"/>
                    <ellipse cx={x+sw+1} cy={104} rx="3" ry="4.5" fill="#82e0aa" opacity="0.8"/>
                  </g>
                );
              })}
              {/* Tea bushes right */}
              {Array.from({length:24}, (_,i) => {
                const x = 588 + i*10;
                return (
                  <g key={i}>
                    <ellipse cx={x} cy={112} rx="5" ry="4" fill="#1a5c2a" opacity="0.9"/>
                    <ellipse cx={x} cy={110} rx="4" ry="3" fill="#27ae60" opacity="0.8"/>
                  </g>
                );
              })}

              {/* River 1 — Ganga */}
              <path d={riverPath1} stroke="#3498db" strokeWidth="4.5" fill="none" opacity="0.75"/>
              <text x="420" y={riverY1(420)-6} textAnchor="middle" fontSize="8" fill="#5dade2" fontFamily="Nunito" fontWeight="700">Ganga →</text>
              {/* River 2 — Yamuna */}
              <path d={riverPath2} stroke="#2980b9" strokeWidth="3" fill="none" opacity="0.6"/>
              <text x="520" y={riverY2(520)+14} textAnchor="middle" fontSize="7" fill="#aed6f1" fontFamily="Nunito">Yamuna →</text>

              {/* Fish in river */}
              {[200, 350, 470].map((x,i) => (
                <g key={i} transform={`translate(${x + Math.sin(t*1.5+i)*20},${riverY1(x)-1})`}>
                  <ellipse cx="0" cy="0" rx="5" ry="2.5" fill="#f39c12" opacity="0.7"/>
                  <polygon points="-6,0 -10,-3 -10,3" fill="#f39c12" opacity="0.7"/>
                </g>
              ))}

              {/* Animated farmer */}
              <g transform={`translate(${farmerX},128)`}>
                <circle cx="0" cy="-18" r="5" fill="#f5cba7"/>
                <rect x="-4" y="-12" width="8" height="11" rx="2" fill="#e74c3c"/>
                {/* Dhoti */}
                <polygon points="-5,-1 5,-1 7,10 -7,10" fill="white" opacity="0.9"/>
                {/* Arms */}
                <line x1="-4" y1="-8" x2="-10" y2={-3+legSwing/3} stroke="#f5cba7" strokeWidth="2"/>
                <line x1="4" y1="-8" x2="10" y2={-3-legSwing/3} stroke="#f5cba7" strokeWidth="2"/>
                {/* Hoe */}
                <line x1="10" y1={-3-legSwing/3} x2="18" y2="8" stroke="#8b6914" strokeWidth="1.8"/>
                <rect x="13" y="4" width="10" height="3" rx="1" fill="#5d3a1a" transform="rotate(-30,18,6)"/>
                {/* Legs */}
                <line x1="-2" y1="9" x2={-4+legSwing} y2="18" stroke="#2c3e50" strokeWidth="2.5"/>
                <line x1="2" y1="9" x2={4-legSwing} y2="18" stroke="#2c3e50" strokeWidth="2.5"/>
                {/* Turban */}
                <ellipse cx="0" cy="-22" rx="6" ry="3" fill="#e74c3c" opacity="0.9"/>
              </g>

              {/* Tractor */}
              <g transform={`translate(${tractorX},130)`}>
                <rect x="-20" y="-18" width="38" height="18" rx="4" fill="#e74c3c"/>
                <rect x="-22" y="-10" width="6" height="10" rx="2" fill="#c0392b"/>
                <circle cx="-16" cy="4" r="8" fill="#2c3e50" stroke="#1a252f" strokeWidth="1.5"/>
                <circle cx="12" cy="4" r="6" fill="#2c3e50" stroke="#1a252f" strokeWidth="1.5"/>
                <circle cx="-16" cy="4" r="3" fill="#7f8c8d"/>
                <circle cx="12" cy="4" r="2.5" fill="#7f8c8d"/>
                {/* Exhaust puff */}
                <circle cx={-24+Math.sin(t*4)*2} cy={-18+Math.cos(t*3)*2} r="3" fill="#7f8c8d" opacity="0.4"/>
                <circle cx={-26+Math.sin(t*4+1)*2} cy={-22+Math.cos(t*3+1)*2} r="2" fill="#7f8c8d" opacity="0.25"/>
              </g>

              {/* Region labels */}
              {regions.map(r => (
                <g key={r.label}>
                  <rect x={r.x+6} y="200" width={r.w-12} height="16" rx="5" fill={`${r.color}25`} stroke={`${r.color}50`} strokeWidth="1"/>
                  <text x={r.x+r.w/2} y="212" textAnchor="middle" fontSize="8.5" fill={r.color} fontWeight="800" fontFamily="Nunito">{r.label}</text>
                </g>
              ))}

              {/* Village hut */}
              <rect x="155" y="148" width="24" height="16" fill="#c8a96c"/>
              <polygon points="152,148 182,148 167,136" fill="#e74c3c"/>
              <rect x="163" y="156" width="8" height="8" fill="#7d5a3c"/>
            </svg>
            <div style={{ background: "rgba(30,132,73,0.5)", padding: "8px 16px", display: "flex", gap: 16, flexWrap: "wrap", justifyContent: "center" }}>
              {[["#f9e79f","Punjab Plains — Wheat"],["#82e0aa","Ganga Plains — Rice & Wheat"],["#85c1e9","Brahmaputra Plains — Tea & Rice"]].map(([c,l])=>(
                <div key={l} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: c, fontWeight: 700 }}>
                  <div style={{ width: 10, height: 10, borderRadius: 2, background: c }}/>{l}
                </div>
              ))}
            </div>
          </div>
        );
      }

      return null;
    }

    function SectionRenderer({ section, accent, bg }) {
      if (section.type === "chapter-animation") {
        return <ChapterAnimation scene={section.scene} />;
      }

      if (section.type === "definition") {
        return (
          <div style={{ background: `${section.color}15`, border: `2px solid ${section.color}50`, borderRadius: 16, padding: "18px 20px", marginBottom: 16, animation: "fadeIn 0.4s ease" }}>
            <div style={{ fontSize: 12, letterSpacing: 1, color: section.color, textTransform: "uppercase", marginBottom: 6 }}>Definition</div>
            <div style={{ fontWeight: 800, color: section.color, fontSize: 17, marginBottom: 8 }}>{section.term}</div>
            <div style={{ fontSize: 15, lineHeight: 1.8, opacity: 0.9 }}>{section.definition}</div>
          </div>
        );
      }

      if (section.type === "fact-cards") {
        return (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
            {section.items.map((item, i) => (
              <div key={i} className="card-hover" style={{ background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 14, padding: "14px 16px", animation: `fadeIn ${0.3 + i * 0.1}s ease` }}>
                <div style={{ fontSize: 26, marginBottom: 6 }}>{item.icon}</div>
                <div style={{ fontWeight: 700, color: accent, fontSize: 14, marginBottom: 4 }}>{item.title}</div>
                <div style={{ fontSize: 12, opacity: 0.8, lineHeight: 1.5 }}>{item.desc}</div>
              </div>
            ))}
          </div>
        );
      }

      if (section.type === "comparison") {
        return (
          <div style={{ marginBottom: 16, animation: "fadeIn 0.5s ease" }}>
            <div style={{ fontSize: 13, color: accent, fontWeight: 700, marginBottom: 10 }}>{section.label}</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              {[section.left, section.right].map((side, i) => (
                <div key={i} style={{ background: `rgba(255,255,255,0.06)`, border: "1px solid rgba(255,255,255,0.1)", borderRadius: 14, padding: 14 }}>
                  <div style={{ fontSize: 24, marginBottom: 6 }}>{side.icon}</div>
                  <div style={{ fontWeight: 800, color: accent, marginBottom: 8 }}>{side.place}</div>
                  {[["🌡️ Climate", side.climate], ["👗 Clothes", side.clothes], ["🏠 House", side.house]].map(([k, v]) => (
                    <div key={k} style={{ fontSize: 12, marginBottom: 4, display: "flex", gap: 6 }}>
                      <span style={{ opacity: 0.6 }}>{k}:</span>
                      <span style={{ fontWeight: 600 }}>{v}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        );
      }

      if (section.type === "numbered-list") {
        return (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
            {section.items.map((item, i) => (
              <div key={i} className="card-hover" style={{ display: "flex", alignItems: "center", gap: 14, background: "rgba(255,255,255,0.06)", borderLeft: `4px solid ${item.color}`, borderRadius: 12, padding: "12px 16px", animation: `fadeIn ${0.2 + i * 0.1}s ease` }}>
                <span style={{ fontWeight: 900, color: item.color, fontSize: 13, minWidth: 24 }}>{item.num}</span>
                <span style={{ fontSize: 22 }}>{item.icon}</span>
                <div>
                  <div style={{ fontWeight: 700, color: item.color, fontSize: 14 }}>{item.name}</div>
                  <div style={{ fontSize: 12, opacity: 0.75, marginTop: 2 }}>{item.desc}</div>
                </div>
              </div>
            ))}
          </div>
        );
      }

      if (section.type === "callout") {
        return (
          <div style={{ background: "rgba(130,224,170,0.1)", border: "1px solid rgba(130,224,170,0.3)", borderRadius: 14, padding: "14px 18px", marginBottom: 16, display: "flex", gap: 12, alignItems: "flex-start", animation: "fadeIn 0.5s ease" }}>
            <span style={{ fontSize: 20, flexShrink: 0 }}>{section.icon}</span>
            <p style={{ margin: 0, fontSize: 14, lineHeight: 1.7, opacity: 0.9 }}>{section.text}</p>
          </div>
        );
      }

      if (section.type === "fact-banner") {
        return (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginBottom: 16 }}>
            {section.facts.map((f, i) => (
              <div key={i} style={{ background: "rgba(255,255,255,0.08)", borderRadius: 12, padding: "12px 8px", textAlign: "center", animation: `fadeIn ${0.2 + i * 0.1}s ease` }}>
                <div style={{ fontSize: 20, marginBottom: 4 }}>{f.icon}</div>
                <div style={{ fontWeight: 800, color: "#f7dc6f", fontSize: 14 }}>{f.val}</div>
                <div style={{ fontSize: 11, opacity: 0.65, marginTop: 2 }}>{f.label}</div>
              </div>
            ))}
          </div>
        );
      }

      if (section.type === "steps") {
        return (
          <div style={{ background: `rgba(231,76,60,0.08)`, border: `1px solid rgba(231,76,60,0.25)`, borderRadius: 16, padding: "18px 20px", marginBottom: 16, animation: "fadeIn 0.5s ease" }}>
            <div style={{ fontWeight: 700, color: "#e74c3c", marginBottom: 14, fontSize: 15 }}>{section.title}</div>
            {section.steps.map((step, i) => (
              <div key={i} style={{ display: "flex", gap: 12, marginBottom: 10, alignItems: "flex-start" }}>
                <span style={{ background: section.color, color: "#fff", borderRadius: "50%", width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 900, flexShrink: 0, marginTop: 1 }}>{i + 1}</span>
                <span style={{ fontSize: 14, lineHeight: 1.6, opacity: 0.9 }}>{step}</span>
              </div>
            ))}
          </div>
        );
      }

      if (section.type === "range-cards") {
        return (
          <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 16 }}>
            {section.ranges.map((r, i) => (
              <div key={i} className="card-hover" style={{ background: `${r.color}10`, border: `2px solid ${r.color}50`, borderRadius: 16, padding: "16px 20px", animation: `fadeIn ${0.2 + i * 0.15}s ease` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                  <div>
                    <div style={{ fontWeight: 800, color: r.color, fontSize: 17 }}>{r.name}</div>
                    <div style={{ fontSize: 12, opacity: 0.65 }}>{r.subtitle}</div>
                  </div>
                  <div style={{ background: `${r.color}20`, border: `1px solid ${r.color}50`, borderRadius: 20, padding: "3px 10px", fontSize: 12, color: r.color, fontWeight: 700 }}>{r.alt}</div>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 4 }}>
                  {r.facts.map((f, fi) => (
                    <div key={fi} style={{ fontSize: 12, opacity: 0.85, padding: "3px 0", paddingLeft: 10, borderLeft: `2px solid ${r.color}50` }}>{f}</div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        );
      }

      if (section.type === "importance-grid") {
        return (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
            {section.items.map((item, i) => (
              <div key={i} className="card-hover" style={{ background: "rgba(255,255,255,0.06)", border: `1px solid ${item.color}30`, borderRadius: 14, padding: "14px 16px", animation: `fadeIn ${0.2 + i * 0.1}s ease` }}>
                <div style={{ fontSize: 26, marginBottom: 6 }}>{item.icon}</div>
                <div style={{ fontWeight: 700, color: item.color, fontSize: 14, marginBottom: 5 }}>{item.title}</div>
                <div style={{ fontSize: 12, opacity: 0.8, lineHeight: 1.5 }}>{item.desc}</div>
              </div>
            ))}
          </div>
        );
      }

      if (section.type === "formation") {
        return (
          <div style={{ background: `${section.color}12`, border: `1px solid ${section.color}40`, borderRadius: 14, padding: "16px 20px", marginBottom: 16, animation: "fadeIn 0.4s ease" }}>
            <div style={{ fontWeight: 700, color: section.color, marginBottom: 8, fontSize: 15 }}>{section.label}</div>
            <p style={{ margin: 0, fontSize: 14, lineHeight: 1.8, opacity: 0.9 }}>{section.text}</p>
          </div>
        );
      }

      if (section.type === "sub-regions") {
        return (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
            {section.items.map((item, i) => (
              <div key={i} style={{ display: "flex", gap: 14, background: "rgba(255,255,255,0.06)", borderLeft: `4px solid ${item.color}`, borderRadius: 12, padding: "12px 16px", animation: `fadeIn ${0.2 + i * 0.1}s ease` }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, color: item.color, marginBottom: 4 }}>{item.name}</div>
                  <div style={{ fontSize: 12, opacity: 0.8 }}>🌊 {item.rivers} &nbsp;|&nbsp; 📍 {item.states} &nbsp;|&nbsp; 🌾 {item.crop}</div>
                </div>
              </div>
            ))}
          </div>
        );
      }

      return null;
    }

    function ActivityRenderer({ activity, pageId, state, setState, accent }) {
      const [revealed, setRevealed] = useState({});

      if (activity.type === "drag-match") {
        const matched = state.matched || {};
        const allDone = Object.keys(matched).length === activity.pairs.length;

        return (
          <div style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 16, padding: 18, marginTop: 20 }}>
            <div style={{ fontWeight: 700, color: accent, marginBottom: 4, fontSize: 14 }}>🎮 Activity — {activity.instruction}</div>
            <div style={{ fontSize: 12, opacity: 0.6, marginBottom: 14 }}>Click a region then click its matching feature!</div>
            {allDone ? (
              <div style={{ textAlign: "center", padding: "20px 0" }}>
                <div style={{ fontSize: 40, marginBottom: 8 }}>🎉</div>
                <div style={{ color: "#82e0aa", fontWeight: 700 }}>All matched correctly! Great job!</div>
                <button onClick={() => setState({ matched: {} })} style={{ marginTop: 10, background: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 10, padding: "6px 14px", color: "#aed6f1", fontSize: 13 }}>Try Again</button>
              </div>
            ) : (
              <MatchActivity pairs={activity.pairs} matched={matched} setMatched={(m) => setState({ matched: m })} accent={accent} />
            )}
          </div>
        );
      }

      if (activity.type === "fill-blank") {
        const answers = state.answers || {};
        const submitted = state.submitted || {};

        return (
          <div style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 16, padding: 18, marginTop: 20 }}>
            <div style={{ fontWeight: 700, color: accent, marginBottom: 14, fontSize: 14 }}>📝 Activity — {activity.instruction}</div>
            {activity.sentences.map((s, i) => {
              const isCorrect = submitted[i] && answers[i]?.toLowerCase().trim() === s.answer.toLowerCase();
              const isWrong = submitted[i] && !isCorrect;
              return (
                <div key={i} style={{ marginBottom: 12 }}>
                  <div style={{ fontSize: 14, marginBottom: 6, lineHeight: 1.7 }}>
                    {s.text.split("___").map((part, pi) => (
                      <span key={pi}>
                        {part}
                        {pi === 0 && (
                          <input
                            value={answers[i] || ""}
                            onChange={e => setState({ answers: { ...answers, [i]: e.target.value } })}
                            disabled={!!submitted[i]}
                            placeholder={submitted[i] ? "" : s.hint}
                            style={{
                              background: isCorrect ? "rgba(130,224,170,0.15)" : isWrong ? "rgba(231,76,60,0.15)" : "rgba(255,255,255,0.1)",
                              border: `1px solid ${isCorrect ? "#82e0aa" : isWrong ? "#e74c3c" : "rgba(255,255,255,0.2)"}`,
                              borderRadius: 8, padding: "3px 10px", color: "#fff", fontSize: 14, outline: "none",
                              width: 120, display: "inline-block", margin: "0 4px",
                            }}
                          />
                        )}
                      </span>
                    ))}
                    {submitted[i] && <span style={{ marginLeft: 8, fontSize: 16 }}>{isCorrect ? "✅" : `❌ (${s.answer})`}</span>}
                  </div>
                  {!submitted[i] && (
                    <button
                      onClick={() => setState({ submitted: { ...submitted, [i]: true } })}
                      style={{ background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 8, padding: "4px 12px", color: "#aed6f1", fontSize: 12 }}
                    >Check</button>
                  )}
                </div>
              );
            })}
          </div>
        );
      }

      if (activity.type === "true-false") {
        const tAnswers = state.tfAnswers || {};
        const score = Object.keys(tAnswers).filter(k => tAnswers[k] === activity.questions[+k].answer).length;
        const allDone = Object.keys(tAnswers).length === activity.questions.length;

        return (
          <div style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 16, padding: 18, marginTop: 20 }}>
            <div style={{ fontWeight: 700, color: accent, marginBottom: 14, fontSize: 14 }}>🎮 Activity — {activity.instruction}</div>
            {activity.questions.map((q, i) => {
              const chosen = tAnswers[i];
              const isAnswered = chosen !== undefined;
              const isCorrect = chosen === q.answer;
              return (
                <div key={i} style={{ background: isAnswered ? (isCorrect ? "rgba(130,224,170,0.1)" : "rgba(231,76,60,0.1)") : "rgba(255,255,255,0.04)", border: `1px solid ${isAnswered ? (isCorrect ? "rgba(130,224,170,0.4)" : "rgba(231,76,60,0.4)") : "rgba(255,255,255,0.08)"}`, borderRadius: 12, padding: "12px 14px", marginBottom: 10 }}>
                  <div style={{ fontSize: 14, marginBottom: 8 }}>{q.q}</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    {[true, false].map(opt => (
                      <button
                        key={String(opt)}
                        onClick={() => !isAnswered && setState({ tfAnswers: { ...tAnswers, [i]: opt } })}
                        disabled={isAnswered}
                        style={{
                          background: isAnswered && chosen === opt ? (isCorrect ? "rgba(130,224,170,0.3)" : "rgba(231,76,60,0.3)") : isAnswered && q.answer === opt ? "rgba(130,224,170,0.3)" : "rgba(255,255,255,0.08)",
                          border: `1px solid ${isAnswered && (chosen === opt || q.answer === opt) ? (q.answer === opt ? "#82e0aa" : "#e74c3c") : "rgba(255,255,255,0.15)"}`,
                          borderRadius: 8, padding: "6px 16px", color: "#e8f4fd", fontSize: 13, fontWeight: 600,
                        }}
                      >{opt ? "True ✓" : "False ✗"}</button>
                    ))}
                    {isAnswered && <span style={{ fontSize: 16, marginLeft: 4 }}>{isCorrect ? "✅" : "❌"}</span>}
                  </div>
                </div>
              );
            })}
            {allDone && <div style={{ color: "#82e0aa", fontWeight: 700, fontSize: 14, marginTop: 8 }}>Score: {score}/{activity.questions.length} 🎉</div>}
          </div>
        );
      }

      if (activity.type === "mcq") {
        const mcqAnswers = state.mcqAnswers || {};

        return (
          <div style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 16, padding: 18, marginTop: 20 }}>
            <div style={{ fontWeight: 700, color: accent, marginBottom: 14, fontSize: 14 }}>🧠 Quick Check — {activity.instruction}</div>
            {activity.questions.map((q, qi) => {
              const selected = mcqAnswers[qi];
              const isAnswered = selected !== undefined;
              return (
                <div key={qi} style={{ marginBottom: 16 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>Q{qi + 1}. {q.q}</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {q.options.map((opt, oi) => {
                      const isSelected = selected === oi;
                      const isCorrect = oi === q.answer;
                      let bg = "rgba(255,255,255,0.06)";
                      let border = "1px solid rgba(255,255,255,0.1)";
                      if (isAnswered) {
                        if (isCorrect) { bg = "rgba(130,224,170,0.15)"; border = "1px solid rgba(130,224,170,0.4)"; }
                        else if (isSelected) { bg = "rgba(231,76,60,0.15)"; border = "1px solid rgba(231,76,60,0.4)"; }
                      }
                      return (
                        <button
                          key={oi}
                          onClick={() => !isAnswered && setState({ mcqAnswers: { ...mcqAnswers, [qi]: oi } })}
                          disabled={isAnswered}
                          style={{ background: bg, border, borderRadius: 10, padding: "8px 14px", color: "#e8f4fd", fontSize: 13, textAlign: "left", display: "flex", gap: 10, alignItems: "center" }}
                        >
                          <span style={{ background: "rgba(255,255,255,0.1)", borderRadius: "50%", width: 20, height: 20, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, flexShrink: 0 }}>{String.fromCharCode(65 + oi)}</span>
                          {opt}
                          {isAnswered && isCorrect && <span style={{ marginLeft: "auto" }}>✅</span>}
                          {isAnswered && isSelected && !isCorrect && <span style={{ marginLeft: "auto" }}>❌</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        );
      }

      if (activity.type === "word-scramble") {
        const wsAnswers = state.wsAnswers || {};
        const wsSubmitted = state.wsSubmitted || {};

        return (
          <div style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 16, padding: 18, marginTop: 20 }}>
            <div style={{ fontWeight: 700, color: accent, marginBottom: 4, fontSize: 14 }}>🔤 Word Scramble — {activity.instruction}</div>
            <div style={{ fontSize: 12, opacity: 0.6, marginBottom: 14 }}>Rearrange the letters to form the correct word</div>
            {activity.words.map((word, i) => {
              const isSubmitted = wsSubmitted[i];
              const isCorrect = wsAnswers[i]?.toUpperCase() === word.answer;
              return (
                <div key={i} style={{ background: "rgba(255,255,255,0.05)", borderRadius: 12, padding: "12px 14px", marginBottom: 10 }}>
                  <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
                    {word.scrambled.split("").map((ch, ci) => (
                      <span key={ci} style={{ background: `${accent}25`, border: `1px solid ${accent}50`, borderRadius: 6, width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 14, color: accent }}>
                        {ch}
                      </span>
                    ))}
                  </div>
                  <div style={{ fontSize: 12, opacity: 0.6, marginBottom: 8 }}>Hint: {word.hint}</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <input
                      value={wsAnswers[i] || ""}
                      onChange={e => setState({ wsAnswers: { ...wsAnswers, [i]: e.target.value.toUpperCase() } })}
                      disabled={isSubmitted}
                      placeholder="Your answer..."
                      style={{ flex: 1, background: isSubmitted ? (isCorrect ? "rgba(130,224,170,0.1)" : "rgba(231,76,60,0.1)") : "rgba(255,255,255,0.08)", border: `1px solid ${isSubmitted ? (isCorrect ? "#82e0aa" : "#e74c3c") : "rgba(255,255,255,0.15)"}`, borderRadius: 8, padding: "6px 12px", color: "#fff", fontSize: 14, outline: "none", textTransform: "uppercase" }}
                    />
                    {!isSubmitted ? (
                      <button onClick={() => setState({ wsSubmitted: { ...wsSubmitted, [i]: true } })} style={{ background: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 8, padding: "6px 14px", color: "#aed6f1", fontSize: 13 }}>Check</button>
                    ) : (
                      <span style={{ fontSize: 20, display: "flex", alignItems: "center" }}>{isCorrect ? "✅" : `❌ ${word.answer}`}</span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        );
      }

      return null;
    }

    function MatchActivity({ pairs, matched, setMatched, accent }) {
      const [selectedRegion, setSelectedRegion] = useState(null);

      const handleRegionClick = (r) => {
        if (Object.keys(matched).includes(r)) return;
        setSelectedRegion(r === selectedRegion ? null : r);
      };

      const handleFeatureClick = (f) => {
        if (!selectedRegion) return;
        const correctFeature = pairs.find(p => p.region === selectedRegion)?.feature;
        if (f === correctFeature) {
          setMatched({ ...matched, [selectedRegion]: f });
        }
        setSelectedRegion(null);
      };

      const regions = pairs.map(p => p.region);
      const features = [...pairs.map(p => p.feature)].sort(() => Math.random() > 0.5 ? 1 : -1);

      return (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
          <div>
            <div style={{ fontSize: 12, color: accent, fontWeight: 700, marginBottom: 8 }}>Regions</div>
            {regions.map((r, i) => (
              <button
                key={r}
                onClick={() => handleRegionClick(r)}
                style={{
                  display: "block", width: "100%", marginBottom: 8,
                  background: matched[r] ? "rgba(130,224,170,0.15)" : selectedRegion === r ? `${accent}25` : "rgba(255,255,255,0.07)",
                  border: `1px solid ${matched[r] ? "#82e0aa" : selectedRegion === r ? accent : "rgba(255,255,255,0.12)"}`,
                  borderRadius: 10, padding: "8px 12px", color: matched[r] ? "#82e0aa" : selectedRegion === r ? accent : "#e8f4fd",
                  fontSize: 13, textAlign: "left", fontWeight: matched[r] ? 700 : 400,
                }}
              >{matched[r] ? "✅ " : ""}{r}</button>
            ))}
          </div>
          <div>
            <div style={{ fontSize: 12, color: accent, fontWeight: 700, marginBottom: 8 }}>Features</div>
            {features.map(f => {
              const isMatched = Object.values(matched).includes(f);
              return (
                <button
                  key={f}
                  onClick={() => handleFeatureClick(f)}
                  style={{
                    display: "block", width: "100%", marginBottom: 8,
                    background: isMatched ? "rgba(130,224,170,0.15)" : "rgba(255,255,255,0.07)",
                    border: `1px solid ${isMatched ? "#82e0aa" : "rgba(255,255,255,0.12)"}`,
                    borderRadius: 10, padding: "8px 12px", color: isMatched ? "#82e0aa" : "#e8f4fd",
                    fontSize: 13, textAlign: "left",
                  }}
                >{f}</button>
              );
            })}
          </div>
        </div>
      );
    }

    function QuizPage({ quizState, setQuizState, questions, quizPercent, goToPage }) {
      const { index, selected, done, score, answers } = quizState;
      const q = questions[index];

      const handleSelect = (i) => {
        if (selected !== null) return;
        const correct = i === q.answer;
        setQuizState({
          ...quizState,
          selected: i,
          score: correct ? score + 1 : score,
          answers: [...answers, { q: index, selected: i, correct }],
        });
      };

      const handleNext = () => {
        if (index < questions.length - 1) {
          setQuizState({ ...quizState, index: index + 1, selected: null });
        } else {
          setQuizState({ ...quizState, done: true });
        }
      };

      const resetQuiz = () => {
        setQuizState({ index: 0, selected: null, done: false, score: 0, answers: [] });
      };

      if (done) {
        return (
          <div style={{ textAlign: "center", padding: "30px 0" }}>
            <div style={{ fontSize: 64, marginBottom: 12 }}>{score >= 5 ? "🏆" : score >= 3 ? "⭐" : "💪"}</div>
            <h2 style={{ color: "#f7dc6f", fontFamily: "'Cinzel', serif" }}>Quiz Complete!</h2>
            <div style={{ background: "linear-gradient(135deg, #1a3a5c, #0d2137)", borderRadius: 20, padding: 24, marginBottom: 20, display: "inline-block", minWidth: 200 }}>
              <div style={{ fontSize: 52, fontWeight: 900, color: score >= 5 ? "#82e0aa" : score >= 3 ? "#f7dc6f" : "#e74c3c" }}>{score}/{questions.length}</div>
              <div style={{ fontSize: 16, opacity: 0.7, marginTop: 4 }}>{quizPercent}%</div>
            </div>
            <div style={{ color: score >= 5 ? "#82e0aa" : "#f7dc6f", fontSize: 16, fontWeight: 700, marginBottom: 24 }}>
              {score >= 5 ? "Excellent! You're a Geography Star! 🌟" : score >= 3 ? "Good work! Keep practising! 📚" : "Keep revising and try again! 💪"}
            </div>
            <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
              <button onClick={resetQuiz} style={{ background: "linear-gradient(135deg, #e67e22, #d35400)", border: "none", borderRadius: 14, padding: "12px 24px", color: "#fff", fontSize: 14, fontWeight: 700 }}>Retake Quiz 🔄</button>
              <button onClick={() => goToPage(totalPages - 1)} style={{ background: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 14, padding: "12px 24px", color: "#aed6f1", fontSize: 14 }}>Get Certificate 🎓</button>
            </div>
          </div>
        );
      }

      return (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <h2 style={{ margin: 0, color: "#f7dc6f", fontFamily: "'Cinzel', serif", fontSize: 20 }}>🧠 Grand Quiz</h2>
            <span style={{ background: "rgba(247,220,111,0.15)", border: "1px solid rgba(247,220,111,0.3)", borderRadius: 10, padding: "4px 12px", fontSize: 13, color: "#f7dc6f" }}>{index + 1} / {questions.length}</span>
          </div>
          <div style={{ background: "rgba(255,255,255,0.06)", borderRadius: 8, height: 6, marginBottom: 20 }}>
            <div style={{ background: "linear-gradient(90deg,#e67e22,#f7dc6f)", borderRadius: 8, height: "100%", width: `${(index / questions.length) * 100}%`, transition: "width 0.4s" }} />
          </div>
          <div style={{ background: "linear-gradient(135deg, #1a3a5c, #0d2137)", borderRadius: 18, padding: "22px 20px", marginBottom: 16 }}>
            <p style={{ fontSize: 17, fontWeight: 700, lineHeight: 1.6, margin: 0 }}>Q{index + 1}. {q.q}</p>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 16 }}>
            {q.options.map((opt, i) => {
              const isSelected = selected === i;
              const isCorrect = i === q.answer;
              let bg = "rgba(255,255,255,0.06)";
              let border = "1px solid rgba(255,255,255,0.1)";
              let color = "#e8f4fd";
              if (selected !== null) {
                if (isCorrect) { bg = "rgba(130,224,170,0.18)"; border = "2px solid #82e0aa"; color = "#82e0aa"; }
                else if (isSelected && !isCorrect) { bg = "rgba(231,76,60,0.18)"; border = "2px solid #e74c3c"; color = "#e74c3c"; }
              }
              return (
                <button key={i} onClick={() => handleSelect(i)} style={{ background: bg, border, borderRadius: 13, padding: "13px 18px", color, fontSize: 14, textAlign: "left", display: "flex", gap: 12, alignItems: "center" }}>
                  <span style={{ background: "rgba(255,255,255,0.1)", borderRadius: "50%", width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, flexShrink: 0 }}>{String.fromCharCode(65 + i)}</span>
                  {opt}
                </button>
              );
            })}
          </div>
          {selected !== null && (
            <>
              <div style={{ background: selected === q.answer ? "rgba(130,224,170,0.1)" : "rgba(231,76,60,0.1)", border: `1px solid ${selected === q.answer ? "#82e0aa" : "#e74c3c"}`, borderRadius: 13, padding: "12px 16px", marginBottom: 14 }}>
                <div style={{ fontWeight: 700, color: selected === q.answer ? "#82e0aa" : "#e74c3c", marginBottom: 5 }}>{selected === q.answer ? "✅ Correct!" : "❌ Not quite!"}</div>
                <p style={{ margin: 0, fontSize: 13, opacity: 0.9 }}>{q.explanation}</p>
              </div>
              <button onClick={handleNext} style={{ width: "100%", background: "linear-gradient(135deg, #e67e22, #d35400)", border: "none", borderRadius: 13, padding: 13, fontSize: 15, fontWeight: 700, color: "#fff" }}>
                {index < questions.length - 1 ? "Next Question →" : "See Results 🎉"}
              </button>
            </>
          )}
        </div>
      );
    }

    function CertificatePage({ studentName, setStudentName, nameInput, setNameInput, quizPercent }) {
      const grade = quizPercent >= 90 ? "A+" : quizPercent >= 75 ? "A" : quizPercent >= 60 ? "B" : quizPercent >= 40 ? "C" : "—";

      if (!studentName) {
        return (
          <div style={{ textAlign: "center", padding: "40px 20px" }}>
            <div style={{ fontSize: 60, marginBottom: 16 }}>🎓</div>
            <h2 style={{ color: "#f7dc6f", fontFamily: "'Cinzel', serif" }}>Get Your Certificate!</h2>
            <p style={{ opacity: 0.7, marginBottom: 24 }}>Enter your name to generate your completion certificate.</p>
            <div style={{ display: "flex", gap: 10, justifyContent: "center", maxWidth: 360, margin: "0 auto" }}>
              <input
                value={nameInput}
                onChange={e => setNameInput(e.target.value)}
                placeholder="Enter your name..."
                style={{ flex: 1, background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 12, padding: "10px 14px", color: "#fff", fontSize: 15, outline: "none" }}
              />
              <button onClick={() => nameInput.trim() && setStudentName(nameInput.trim())} style={{ background: "linear-gradient(135deg, #e67e22, #d35400)", border: "none", borderRadius: 12, padding: "10px 20px", color: "#fff", fontWeight: 700, fontSize: 14 }}>Generate</button>
            </div>
          </div>
        );
      }

      return (
        <div style={{ textAlign: "center", padding: "20px 0" }}>
          <div style={{
            background: "linear-gradient(135deg, #0d2137, #1a3a5c)",
            border: "3px solid #f7dc6f",
            borderRadius: 24, padding: "32px 30px",
            position: "relative",
            overflow: "hidden",
          }}>
            {['top-left', 'top-right', 'bottom-left', 'bottom-right'].map(pos => (
              <div key={pos} style={{
                position: "absolute",
                [pos.includes("top") ? "top" : "bottom"]: 12,
                [pos.includes("left") ? "left" : "right"]: 12,
                fontSize: 20, opacity: 0.5,
              }}>✦</div>
            ))}
            <div style={{ fontSize: 12, letterSpacing: 4, color: "#f7dc6f", textTransform: "uppercase", marginBottom: 8, opacity: 0.8 }}>This Certifies That</div>
            <div style={{ fontFamily: "'Cinzel', serif", fontSize: 28, fontWeight: 700, color: "#fff", marginBottom: 8 }}>{studentName}</div>
            <div style={{ fontSize: 14, opacity: 0.7, marginBottom: 20 }}>Has Successfully Completed</div>
            <div style={{ fontFamily: "'Cinzel', serif", fontSize: 18, color: "#f7dc6f", marginBottom: 20, lineHeight: 1.4 }}>Geographical Diversity of India<br /><span style={{ fontSize: 14, opacity: 0.7, fontFamily: "inherit" }}>Grade 7 • Social Studies</span></div>
            <div style={{ display: "flex", justifyContent: "center", gap: 30, marginBottom: 24 }}>
              <div>
                <div style={{ fontWeight: 800, color: "#82e0aa", fontSize: 28 }}>{quizPercent > 0 ? `${quizPercent}%` : "—"}</div>
                <div style={{ fontSize: 12, opacity: 0.6 }}>Quiz Score</div>
              </div>
              <div style={{ width: 1, background: "rgba(255,255,255,0.1)" }} />
              <div>
                <div style={{ fontWeight: 800, color: "#f7dc6f", fontSize: 28 }}>{grade}</div>
                <div style={{ fontSize: 12, opacity: 0.6 }}>Grade</div>
              </div>
            </div>
            <div style={{ fontSize: 11, opacity: 0.4, letterSpacing: 2 }}>ISSUED {new Date().toLocaleDateString("en-IN", { year: "numeric", month: "long", day: "numeric" }).toUpperCase()}</div>
          </div>
          <button onClick={() => setStudentName("")} style={{ marginTop: 16, background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 10, padding: "8px 18px", color: "#aed6f1", fontSize: 13 }}>Edit Name</button>
        </div>
      );
    }

    function FlashcardsPage({ cards }) {
      const [current, setCurrent] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [visited, setVisited] = useState(new Set());

      const goCard = (dir) => {
        const next = current + dir;
        if (next < 0 || next >= cards.length) return;
        setCurrent(next);
        setFlipped(false);
      };

      const handleFlip = () => {
        setFlipped(f => !f);
        setVisited(v => new Set([...v, current]));
      };

      const card = cards[current];

      return (
        <div style={{ padding: "20px 0" }}>
          <h2 style={{ color: "#f7dc6f", margin: "0 0 6px", fontFamily: "'Cinzel', serif", fontSize: 24 }}>🎴 Flashcards</h2>
          <p style={{ color: "rgba(255,255,255,0.5)", fontSize: 13, marginBottom: 24 }}>Click the card to reveal the answer · {visited.size}/{cards.length} cards seen</p>

          {/* Progress dots */}
          <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 20 }}>
            {cards.map((_, i) => (
              <div key={i} onClick={() => { setCurrent(i); setFlipped(false); }} style={{ width: 10, height: 10, borderRadius: "50%", cursor: "pointer", background: i === current ? "#f7dc6f" : visited.has(i) ? "#82e0aa" : "rgba(255,255,255,0.2)", transition: "all 0.2s" }} />
            ))}
          </div>

          {/* Card */}
          <div onClick={handleFlip} style={{ cursor: "pointer", perspective: 1000 }}>
            <div style={{
              position: "relative", width: "100%", minHeight: 280,
              transition: "transform 0.55s cubic-bezier(0.4,0.2,0.2,1)",
              transformStyle: "preserve-3d",
              transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)",
            }}>
              {/* Front */}
              <div style={{
                position: "absolute", inset: 0, backfaceVisibility: "hidden", WebkitBackfaceVisibility: "hidden",
                background: "linear-gradient(135deg, #1a3a5c, #0d2137)",
                border: "2px solid rgba(247,220,111,0.4)",
                borderRadius: 24, padding: "36px 28px",
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                boxShadow: "0 0 40px rgba(247,220,111,0.15), 0 8px 32px rgba(0,0,0,0.5)",
                minHeight: 280,
              }}>
                <div style={{ fontSize: 13, letterSpacing: 3, color: "#f7dc6f", textTransform: "uppercase", marginBottom: 20, opacity: 0.7 }}>Question {current + 1} of {cards.length}</div>
                <div style={{ fontSize: 16, fontWeight: 700, lineHeight: 1.7, textAlign: "center", color: "#e8f4fd", maxWidth: 500 }}>{card.q}</div>
                <div style={{ marginTop: 28, fontSize: 12, color: "rgba(255,255,255,0.35)", display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontSize: 16 }}>👆</span> Tap to flip
                </div>
              </div>
              {/* Back */}
              <div style={{
                position: "absolute", inset: 0, backfaceVisibility: "hidden", WebkitBackfaceVisibility: "hidden",
                transform: "rotateY(180deg)",
                background: "linear-gradient(135deg, #0b5345, #1e8449)",
                border: "2px solid rgba(130,224,170,0.5)",
                borderRadius: 24, padding: "28px 28px",
                display: "flex", flexDirection: "column", justifyContent: "center",
                boxShadow: "0 0 40px rgba(130,224,170,0.2), 0 8px 32px rgba(0,0,0,0.5)",
                minHeight: 280,
              }}>
                <div style={{ fontSize: 12, letterSpacing: 3, color: "#82e0aa", textTransform: "uppercase", marginBottom: 14, opacity: 0.8 }}>✅ Answer</div>
                <div style={{ fontSize: 14, lineHeight: 1.85, color: "#e8f4fd", whiteSpace: "pre-line" }}>{card.a}</div>
              </div>
            </div>
          </div>

          {/* Nav buttons */}
          <div style={{ display: "flex", gap: 12, marginTop: 24, justifyContent: "center" }}>
            <button onClick={() => goCard(-1)} disabled={current === 0} style={{ background: current === 0 ? "rgba(255,255,255,0.05)" : "linear-gradient(135deg,#e74c3c,#c0392b)", border: "none", borderRadius: 14, padding: "12px 28px", color: current === 0 ? "#555" : "#fff", fontSize: 15, fontWeight: 700, transition: "all 0.2s" }}>← Prev</button>
            <button onClick={() => setFlipped(f => !f)} style={{ background: "linear-gradient(135deg,#9b59b6,#7d3c98)", border: "none", borderRadius: 14, padding: "12px 28px", color: "#fff", fontSize: 15, fontWeight: 700 }}>🔄 Flip</button>
            <button onClick={() => goCard(1)} disabled={current === cards.length - 1} style={{ background: current === cards.length - 1 ? "rgba(255,255,255,0.05)" : "linear-gradient(135deg,#27ae60,#1e8449)", border: "none", borderRadius: 14, padding: "12px 28px", color: current === cards.length - 1 ? "#555" : "#fff", fontSize: 15, fontWeight: 700, transition: "all 0.2s" }}>Next →</button>
          </div>
          <div style={{ textAlign: "center", marginTop: 14, fontSize: 13, opacity: 0.5 }}>
            {visited.size === cards.length ? "🎉 You've seen all cards! Great revision!" : `${cards.length - visited.size} cards remaining`}
          </div>
        </div>
      );
    }

    function ChapterQuizPage({ questions }) {
      const [idx, setIdx] = useState(0);
      const [selected, setSelected] = useState(null);
      const [score, setScore] = useState(0);
      const [done, setDone] = useState(false);
      const [answers, setAnswers] = useState([]);

      const q = questions[idx];
      const percent = done ? Math.round((score / questions.length) * 100) : 0;

      const handleSelect = (i) => {
        if (selected !== null) return;
        const correct = i === q.answer;
        setSelected(i);
        if (correct) setScore(s => s + 1);
        setAnswers(a => [...a, { correct }]);
      };

      const handleNext = () => {
        if (idx < questions.length - 1) { setIdx(i => i + 1); setSelected(null); }
        else setDone(true);
      };

      const reset = () => { setIdx(0); setSelected(null); setScore(0); setDone(false); setAnswers([]); };

      if (done) {
        return (
          <div style={{ padding: "20px 0", textAlign: "center" }}>
            <h2 style={{ color: "#f7dc6f", fontFamily: "'Cinzel', serif" }}>Chapter Quiz Complete!</h2>
            <div style={{ fontSize: 60, marginBottom: 16 }}>{percent >= 80 ? "🏆" : percent >= 50 ? "⭐" : "💪"}</div>
            <div style={{ background: "linear-gradient(135deg,#1a3a5c,#0d2137)", borderRadius: 20, padding: "24px 36px", display: "inline-block", marginBottom: 20, border: "2px solid rgba(247,220,111,0.3)" }}>
              <div style={{ fontSize: 54, fontWeight: 900, color: percent >= 80 ? "#82e0aa" : percent >= 50 ? "#f7dc6f" : "#e74c3c" }}>{score}/{questions.length}</div>
              <div style={{ fontSize: 15, opacity: 0.6, marginTop: 4 }}>{percent}% correct</div>
            </div>
            <div style={{ color: percent >= 80 ? "#82e0aa" : "#f7dc6f", fontSize: 15, fontWeight: 700, marginBottom: 24 }}>
              {percent >= 80 ? "Excellent! You're a Geography Champion! 🌟" : percent >= 50 ? "Good effort! Review and try again! 📚" : "Keep studying and give it another shot! 💪"}
            </div>
            <button onClick={reset} style={{ background: "linear-gradient(135deg,#e74c3c,#c0392b)", border: "none", borderRadius: 14, padding: "12px 28px", color: "#fff", fontSize: 15, fontWeight: 700 }}>🔄 Retry Quiz</button>
          </div>
        );
      }

      return (
        <div style={{ padding: "20px 0" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <h2 style={{ margin: 0, color: "#f7dc6f", fontFamily: "'Cinzel', serif", fontSize: 20 }}>❓ Chapter Quiz</h2>
            <span style={{ background: "rgba(231,76,60,0.15)", border: "1px solid rgba(231,76,60,0.4)", borderRadius: 10, padding: "4px 14px", fontSize: 13, color: "#e74c3c", fontWeight: 700 }}>{idx + 1} / {questions.length}</span>
          </div>
          <div style={{ background: "rgba(255,255,255,0.06)", borderRadius: 8, height: 6, marginBottom: 20 }}>
            <div style={{ background: "linear-gradient(90deg,#e74c3c,#f7dc6f)", borderRadius: 8, height: "100%", width: `${(idx / questions.length) * 100}%`, transition: "width 0.4s" }} />
          </div>
          <div style={{ background: "linear-gradient(135deg,#1a3a5c,#0d2137)", borderRadius: 18, padding: "22px 20px", marginBottom: 16, border: "1px solid rgba(255,255,255,0.08)" }}>
            <p style={{ fontSize: 17, fontWeight: 700, lineHeight: 1.65, margin: 0 }}>Q{idx + 1}. {q.q}</p>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 16 }}>
            {q.options.map((opt, i) => {
              let bg = "rgba(255,255,255,0.06)", border = "1px solid rgba(255,255,255,0.1)", color = "#e8f4fd";
              if (selected !== null) {
                if (i === q.answer) { bg = "rgba(130,224,170,0.18)"; border = "2px solid #82e0aa"; color = "#82e0aa"; }
                else if (i === selected && i !== q.answer) { bg = "rgba(231,76,60,0.18)"; border = "2px solid #e74c3c"; color = "#e74c3c"; }
              }
              return (
                <button key={i} onClick={() => handleSelect(i)} style={{ background: bg, border, borderRadius: 13, padding: "13px 18px", color, fontSize: 14, textAlign: "left", display: "flex", gap: 12, alignItems: "center", transition: "all 0.2s" }}>
                  <span style={{ background: "rgba(255,255,255,0.1)", borderRadius: "50%", width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, flexShrink: 0 }}>{String.fromCharCode(65 + i)}</span>
                  {opt}
                </button>
              );
            })}
          </div>
          {selected !== null && (
            <>
              <div style={{ background: selected === q.answer ? "rgba(130,224,170,0.1)" : "rgba(231,76,60,0.1)", border: `1px solid ${selected === q.answer ? "#82e0aa" : "#e74c3c"}`, borderRadius: 13, padding: "12px 16px", marginBottom: 14 }}>
                <div style={{ fontWeight: 700, color: selected === q.answer ? "#82e0aa" : "#e74c3c", marginBottom: 5 }}>{selected === q.answer ? "✅ Correct!" : "❌ Not quite!"}</div>
                <p style={{ margin: 0, fontSize: 13, opacity: 0.9 }}>{q.explanation}</p>
              </div>
              <button onClick={handleNext} style={{ width: "100%", background: "linear-gradient(135deg,#e67e22,#d35400)", border: "none", borderRadius: 13, padding: 13, fontSize: 15, fontWeight: 700, color: "#fff" }}>
                {idx < questions.length - 1 ? "Next Question →" : "See Results 🎉"}
              </button>
            </>
          )}
        </div>
      );
    }

    function MindMapPage() {
      const [activeNode, setActiveNode] = useState(null);

      const nodes = {
        center: { id: "center", label: "Geographical\nDiversity\nof India", x: 420, y: 310, r: 54, color: "#f7dc6f", textColor: "#0d2137", fontSize: 12 },
        branches: [
          {
            id: "himalayas", label: "🏔️ The\nHimalayas", x: 420, y: 100, r: 42, color: "#85c1e9", textColor: "#0d2137",
            info: "Highest mountain range in the world. Spans 2,400 km. Natural boundary of India. Source of major rivers.",
            children: [
              { id: "himadri", label: "Himadri\n>6000m", x: 240, y: 45, r: 30, color: "#aed6f1", textColor: "#0d2137", info: "Greater Himalayas. Always snow-covered. Contains Mt. Everest (8,848m) & Kangchenjunga. Home to Gangotri Glacier." },
              { id: "himachal", label: "Himachal\n3700-4500m", x: 420, y: 30, r: 30, color: "#aed6f1", textColor: "#0d2137", info: "Lesser Himalayas. Famous hill stations: Shimla, Mussoorie, Darjeeling, Nainital. Rich biodiversity." },
              { id: "shiwalik", label: "Shiwalik\n900-1200m", x: 600, y: 45, r: 30, color: "#aed6f1", textColor: "#0d2137", info: "Outer Himalayas. Lowest range. Dense forests. Cities: Dehradun, Haridwar. Transition zone to plains." },
            ],
          },
          {
            id: "plains", label: "🌾 Northern\nPlains", x: 670, y: 220, r: 42, color: "#82e0aa", textColor: "#0d2137",
            info: "Most fertile region. Formed by alluvial deposits. Home to ~40% of India's population.",
            children: [
              { id: "punjab", label: "Punjab\nPlains", x: 780, y: 140, r: 28, color: "#a9dfbf", textColor: "#0d2137", info: "Rivers: Sutlej & Beas. States: Punjab & Haryana. Major crop: Wheat. Known as 'Bread Basket of India'." },
              { id: "ganga", label: "Ganga\nPlains", x: 820, y: 230, r: 28, color: "#a9dfbf", textColor: "#0d2137", info: "Rivers: Ganga & Yamuna. States: UP, Bihar, WB. Crops: Rice & Wheat. Most densely populated region." },
              { id: "brahma", label: "Brahmaputra\nPlains", x: 780, y: 320, r: 28, color: "#a9dfbf", textColor: "#0d2137", info: "River: Brahmaputra. State: Assam. Crops: Tea & Rice. Famous for one-horned rhinoceros." },
            ],
          },
          {
            id: "desert", label: "🏜️ Thar\nDesert", x: 610, y: 430, r: 42, color: "#f9e79f", textColor: "#0d2137",
            info: "Great Indian Desert in Rajasthan. Hot & arid. Famous for sand dunes, camels, and sparse vegetation.",
            children: [
              { id: "thar1", label: "Rajasthan\nLocation", x: 710, y: 500, r: 26, color: "#fdebd0", textColor: "#0d2137", info: "Mainly in Rajasthan, extending to Gujarat, Punjab & Haryana. Covers ~200,000 sq km." },
              { id: "thar2", label: "Hot &\nArid", x: 660, y: 540, r: 26, color: "#fdebd0", textColor: "#0d2137", info: "Very high daytime temperatures (up to 50°C), freezing nights. Receives <250mm rainfall per year." },
            ],
          },
          {
            id: "peninsula", label: "⛰️ Peninsular\nPlateau", x: 260, y: 460, r: 42, color: "#f0b27a", textColor: "#0d2137",
            info: "Deccan Plateau. Bounded by Eastern & Western Ghats. Rich in minerals like coal, iron ore, and diamonds.",
            children: [
              { id: "west-ghats", label: "Western\nGhats", x: 130, y: 520, r: 28, color: "#f5cba7", textColor: "#0d2137", info: "UNESCO World Heritage. Run along west coast. Annual rainfall >2,000mm. Dense tropical forests." },
              { id: "east-ghats", label: "Eastern\nGhats", x: 220, y: 560, r: 28, color: "#f5cba7", textColor: "#0d2137", info: "Discontinuous range. Lower altitude than Western Ghats. States: AP, Odisha, Tamil Nadu." },
            ],
          },
          {
            id: "islands", label: "🏝️ Islands", x: 180, y: 260, r: 42, color: "#d7bde2", textColor: "#0d2137",
            info: "Two main island groups. Important for strategic defence and marine biodiversity.",
            children: [
              { id: "andaman", label: "Andaman &\nNicobar", x: 65, y: 185, r: 30, color: "#e8daef", textColor: "#0d2137", info: "Bay of Bengal. 572 islands. Tropical rainforests. Coral reefs. Port Blair is the capital." },
              { id: "laksha", label: "Laksha-\ndweep", x: 55, y: 300, r: 30, color: "#e8daef", textColor: "#0d2137", info: "Arabian Sea. 36 coral islands. Smallest Union Territory. Rich in marine life & lagoons." },
            ],
          },
        ],
      };

      const allNodes = [nodes.center, ...nodes.branches, ...nodes.branches.flatMap(b => b.children || [])];
      const active = allNodes.find(n => n.id === activeNode);

      // Build connection lines
      const lines = [];
      nodes.branches.forEach(b => {
        lines.push({ x1: nodes.center.x, y1: nodes.center.y, x2: b.x, y2: b.y, color: b.color });
        (b.children || []).forEach(c => {
          lines.push({ x1: b.x, y1: b.y, x2: c.x, y2: c.y, color: c.color });
        });
      });

      const wrapText = (text) => text.split("\n");

      return (
        <div style={{ padding: "20px 0" }}>
          <h2 style={{ color: "#f7dc6f", margin: "0 0 6px", fontFamily: "'Cinzel', serif", fontSize: 24 }}>🧠 Mind Map</h2>
          <p style={{ color: "rgba(255,255,255,0.5)", fontSize: 13, marginBottom: 16 }}>Click any node to learn more about that topic</p>

          <div style={{ position: "relative", background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 20, overflow: "hidden" }}>
            <svg viewBox="0 0 840 620" style={{ width: "100%", display: "block" }}>
              <defs>
                <filter id="glow">
                  <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                  <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
              </defs>
              {/* Connection lines */}
              {lines.map((l, i) => (
                <line key={i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke={l.color} strokeWidth="2.5" strokeOpacity="0.45" strokeDasharray="5,4" />
              ))}
              {/* Nodes */}
              {[nodes.center, ...nodes.branches].map(node => (
                <g key={node.id} onClick={() => setActiveNode(activeNode === node.id ? null : node.id)} style={{ cursor: "pointer" }}>
                  <circle cx={node.x} cy={node.y} r={node.r + (activeNode === node.id ? 5 : 0)} fill={node.color} opacity={activeNode && activeNode !== node.id ? 0.6 : 1} filter="url(#glow)" style={{ transition: "all 0.2s" }} />
                  {wrapText(node.label).map((line, li, arr) => (
                    <text key={li} x={node.x} y={node.y + (li - (arr.length - 1) / 2) * (node.fontSize || 11) * 1.3} textAnchor="middle" dominantBaseline="middle" fontSize={node.fontSize || 11} fontWeight="800" fill={node.textColor} fontFamily="'Nunito', sans-serif">{line}</text>
                  ))}
                </g>
              ))}
              {nodes.branches.map(b => (b.children || []).map(child => (
                <g key={child.id} onClick={() => setActiveNode(activeNode === child.id ? null : child.id)} style={{ cursor: "pointer" }}>
                  <circle cx={child.x} cy={child.y} r={child.r + (activeNode === child.id ? 4 : 0)} fill={child.color} opacity={activeNode && activeNode !== child.id ? 0.55 : 1} filter="url(#glow)" style={{ transition: "all 0.2s" }} />
                  {wrapText(child.label).map((line, li, arr) => (
                    <text key={li} x={child.x} y={child.y + (li - (arr.length - 1) / 2) * 10 * 1.3} textAnchor="middle" dominantBaseline="middle" fontSize={9.5} fontWeight="700" fill={child.textColor} fontFamily="'Nunito', sans-serif">{line}</text>
                  ))}
                </g>
              )))}
            </svg>
          </div>

          {/* Info panel */}
          {active && active.id !== "center" && (
            <div style={{ marginTop: 16, background: `${active.color}18`, border: `2px solid ${active.color}60`, borderRadius: 16, padding: "16px 20px", animation: "fadeIn 0.25s ease" }}>
              <div style={{ fontWeight: 800, color: active.color, fontSize: 15, marginBottom: 8 }}>{active.label.replace(/\n/g, " ")}</div>
              <p style={{ margin: 0, fontSize: 14, lineHeight: 1.8, opacity: 0.9 }}>{active.info}</p>
            </div>
          )}
          {!activeNode && (
            <div style={{ marginTop: 14, textAlign: "center", fontSize: 13, color: "rgba(255,255,255,0.35)" }}>
              👆 Tap any node to explore details
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
