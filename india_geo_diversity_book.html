    if (quizIndex < QUIZ_QUESTIONS.length - 1) {
      setQuizIndex(quizIndex + 1);
      setSelected(null);
    } else {
      setQuizDone(true);
    }
  };

  const resetQuiz = () => {
    setQuizIndex(0);
    setSelected(null);
    setQuizDone(false);
    setScore(0);
    setAnswers([]);
  };

  const handleActivityCheck = () => {
    const correct = ACTIVITY_QUESTIONS[activityStep].answer.toLowerCase().includes(activityInput.toLowerCase());
    setActivityResult(correct ? "Correct!" : "Try again!");
    if (correct) {
      setActivityScore(activityScore + 1);
      if (activityStep < ACTIVITY_QUESTIONS.length - 1) {
        setTimeout(() => {
          setActivityStep(activityStep + 1);
          setActivityInput("");
          setActivityResult(null);
        }, 1000);
      } else {
        setActivityDone(true);
      }
    }
  };

  const handleActivityNext = () => {
    if (activityStep < ACTIVITY_QUESTIONS.length - 1) {
      setActivityStep(activityStep + 1);
      setActivityInput("");
      setActivityResult(null);
    } else {
      setActivityDone(true);
    }
  };

    setActivityStep(0);
    setActivityInput("");
    setActivityResult(null);
    setActivityScore(0);
    setActivityDone(false);
  };

    if (!doubt.trim()) return;

      );

      setAiLoading(false);

            <div style={{ maxWidth: "1200px", margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "10px" }}>
              <h1 style={{ margin: 0, fontSize: "24px", cursor: "pointer" }} onClick={() => setOnLandingPage(true)}>🌍 Geographical Diversity</h1>
              <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center" }}>
                {TABS.map((tab) => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
                    background: activeTab === tab.id ? tab.color : "rgba(255,255,255,0.18)",
                    color: activeTab === tab.id ? "#fff" : scrolled ? "#000" : "#fff",
                    border: `2px solid ${activeTab === tab.id ? tab.color : "rgba(255,255,255,0.25)"}`,
                    padding: "12px 18px",
                    borderRadius: "25px",
                    cursor: "pointer",
                    fontSize: "14px",
                    fontWeight: activeTab === tab.id ? "bold" : "500",
                    boxShadow: activeTab === tab.id ? `0 0 20px ${tab.color}80` : "0 4px 12px rgba(0,0,0,0.08)",
                    transition: "all 0.3s ease",
                    textAlign: "center"
                  }}>
                    {tab.icon} {tab.label}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main style={{ paddingTop: "80px", maxWidth: "1200px", margin: "0 auto", padding: "100px 20px 20px" }}>
        {activeTab === "read" && (
          <div>
            <h2 style={{ textAlign: "center", marginBottom: "30px" }}>📖 Read Chapter</h2>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "20px", gap: "10px" }}>
              <button onClick={() => readSection === 0 ? setOnLandingPage(true) : setReadSection(Math.max(0, readSection - 1))} style={{
                padding: "10px 20px",
                background: "#4CAF50",
                color: "#fff",
                border: "none",
                borderRadius: "5px",
                cursor: "pointer",
                boxShadow: "0 4px 10px rgba(76,175,80,0.3)",
                transition: "all 0.3s ease",
                opacity: readSection === 0 ? 1 : 1
              }}
              onMouseEnter={(e) => {
                e.target.style.transform = "translateY(-2px) scale(1.05)";
                e.target.style.boxShadow = "0 6px 20px rgba(76,175,80,0.6)";
              }}
              onMouseLeave={(e) => {
                e.target.style.transform = "translateY(0) scale(1)";
                e.target.style.boxShadow = "0 4px 10px rgba(76,175,80,0.3)";
              }}>← Prev</button>
              <span style={{ textAlign: "center", flex: 1 }}>Section {readSection + 1} of {READ_SECTIONS.length}</span>
              <button onClick={() => setReadSection(Math.min(READ_SECTIONS.length - 1, readSection + 1))} disabled={readSection === READ_SECTIONS.length - 1} style={{
                padding: "10px 20px",
                background: "#4CAF50",
                color: "#fff",
                border: "none",
                borderRadius: "5px",
                cursor: "pointer",
                boxShadow: "0 4px 10px rgba(76,175,80,0.3)",
                transition: "all 0.3s ease",
                opacity: readSection === READ_SECTIONS.length - 1 ? 0.5 : 1
              }}
              onMouseEnter={(e) => {
                if (readSection !== READ_SECTIONS.length - 1) {
                  e.target.style.transform = "translateY(-2px) scale(1.05)";
                  e.target.style.boxShadow = "0 6px 20px rgba(76,175,80,0.6)";
                }
              }}
              onMouseLeave={(e) => {
                e.target.style.transform = "translateY(0) scale(1)";
                e.target.style.boxShadow = "0 4px 10px rgba(76,175,80,0.3)";
              }}>Next →</button>
            </div>
            <div style={{ background: READ_SECTIONS[readSection].bg, color: "#fff", padding: "40px", borderRadius: "10px", boxShadow: "0 4px 20px rgba(0,0,0,0.1)" }}>
              <h3 style={{ textAlign: "center", fontSize: "28px", marginBottom: "20px" }}>{READ_SECTIONS[readSection].emoji} <span style={bubbleStyle}>{READ_SECTIONS[readSection].title}</span></h3>
              {READ_SECTIONS[readSection].content}
            </div>
          </div>
        )}

        {activeTab === "summary" && (
          <div>
            <h2 style={{ textAlign: "center", marginBottom: "30px" }}>📋 Summary</h2>
            <div style={{ background: "#fff", padding: "30px", borderRadius: "10px", boxShadow: "0 4px 20px rgba(0,0,0,0.1)" }}>
              <p style={{ fontSize: "18px", lineHeight: "1.6", marginBottom: "20px" }}>
                India exhibits remarkable geographical diversity with varied landforms, climates, and ecosystems spanning from the Himalayas in the north to coastal regions in the south.
              </p>
              <ul style={{ fontSize: "16px", lineHeight: "1.8", marginLeft: "20px" }}>
                <li><strong>Himalayas:</strong> Young fold mountains, source of major rivers</li>
                <li><strong>Northern Plains:</strong> Fertile alluvial soil, intensive agriculture</li>
                <li><strong>Deserts:</strong> Arid regions requiring special adaptations</li>
                <li><strong>Coastal Areas:</strong> Fishing communities and trade centers</li>
                <li><strong>Plateaus:</strong> Rich mineral resources</li>
              </ul>
            </div>
          </div>
        )}

        {activeTab === "quiz" && (
          <div>
            <h2 style={{ textAlign: "center", marginBottom: "30px" }}>🧠 Quiz</h2>
            {!quizDone ? (
              <div style={{ background: "#fff", padding: "30px", borderRadius: "10px", boxShadow: "0 4px 20px rgba(0,0,0,0.1)" }}>
                <h3 style={{ marginBottom: "20px" }}>Q{quizIndex + 1}: {QUIZ_QUESTIONS[quizIndex].q}</h3>
                <div style={{ display: "flex", flexDirection: "column", gap: "10px", marginBottom: "20px" }}>
                  {QUIZ_QUESTIONS[quizIndex].options.map((opt, i) => (
                    <button key={i} onClick={() => handleQuizSelect(i)} style={{ padding: "15px", background: selected === i ? "#4CAF50" : "#f0f0f0", color: selected === i ? "#fff" : "#000", border: "none", borderRadius: "5px", cursor: "pointer", textAlign: "left", fontSize: "16px", fontWeight: selected === i ? "bold" : "normal" }}>
                      {i + 1}. {opt}
                    </button>
                  ))}
                </div>
                <button onClick={handleNextQuiz} disabled={selected === null} style={{
                  padding: "10px 20px",
                  background: "#4CAF50",
                  color: "#fff",
                  border: "none",
                  borderRadius: "5px",
                  cursor: "pointer",
                  boxShadow: "0 4px 10px rgba(76,175,80,0.3)",
                  transition: "all 0.3s ease",
                  width: "100%",
                  opacity: selected === null ? 0.5 : 1
                }}
                onMouseEnter={(e) => {
                  if (selected !== null) {
                    e.target.style.transform = "translateY(-2px) scale(1.05)";
                    e.target.style.boxShadow = "0 6px 20px rgba(76,175,80,0.6)";
                  }
                }}
                onMouseLeave={(e) => {
                  e.target.style.transform = "translateY(0) scale(1)";
                  e.target.style.boxShadow = "0 4px 10px rgba(76,175,80,0.3)";
                }}>
                  {quizIndex < QUIZ_QUESTIONS.length - 1 ? "Next Question" : "Finish Quiz"}
                </button>
              </div>
            ) : (
              <div style={{ background: "#fff", padding: "30px", borderRadius: "10px", boxShadow: "0 4px 20px rgba(0,0,0,0.1)" }}>
                <h3 style={{ textAlign: "center", marginBottom: "20px" }}>Quiz Results</h3>
                <p style={{ textAlign: "center", fontSize: "24px", marginBottom: "20px" }}>Score: {score}/{QUIZ_QUESTIONS.length} ({quizPercent}%)</p>
                <button onClick={resetQuiz} style={{
                  padding: "10px 20px",
                  background: "#4CAF50",
                  color: "#fff",
                  border: "none",
                  borderRadius: "5px",
                  cursor: "pointer",
                  boxShadow: "0 4px 10px rgba(76,175,80,0.3)",
                  transition: "all 0.3s ease",
                  width: "100%"
                }}
                onMouseEnter={(e) => {
                  e.target.style.transform = "translateY(-2px) scale(1.05)";
                  e.target.style.boxShadow = "0 6px 20px rgba(76,175,80,0.6)";
                }}
                onMouseLeave={(e) => {
                  e.target.style.transform = "translateY(0) scale(1)";
                  e.target.style.boxShadow = "0 4px 10px rgba(76,175,80,0.3)";
                }}>Retake Quiz</button>
              </div>
            )}
          </div>
        )}

        {activeTab === "flashcards" && (
          <div>
            <h2 style={{ textAlign: "center", marginBottom: "30px" }}>🃏 Flash Cards</h2>
            <div style={{ background: "#fff", padding: "30px", borderRadius: "10px", boxShadow: "0 4px 20px rgba(0,0,0,0.1)", textAlign: "center" }}>
              <p style={{ fontSize: "18px", marginBottom: "20px" }}>Test your knowledge with interactive flash cards!</p>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: "20px" }}>
                {[
                  { front: "What is Geographical Diversity?", back: "Presence of different landforms, climates, vegetation, and human adaptation." },
                  { front: "Highest range of Himalayas?", back: "Himadri (Greater Himalayas)" },
                  { front: "Why are Himalayas called 'Water Tower'?", back: "They store snow that melts into rivers." },
                  { front: "Northern Plains formed by?", back: "Deposits from Himalayan rivers." },
                  { front: "Thar Desert known for?", back: "Hot and dry climate, camels." },
                  { front: "Coastal areas famous for?", back: "Fishing and seafood trade." },
                ].map((card, i) => (
                  <div key={i} style={{
                    background: "#f0f0f0",
                    borderRadius: "10px",
                    padding: "20px",
                    cursor: "pointer",
                    boxShadow: "0 4px 10px rgba(0,0,0,0.1)",
                    transition: "transform 0.3s ease"
                  }}
                  onClick={(e) => {
                    const back = e.target.querySelector('.back');
                    const front = e.target.querySelector('.front');
                    if (back.style.display === 'none') {
                      back.style.display = 'block';
                      front.style.display = 'none';
                      e.target.style.transform = 'rotateY(180deg)';
                    } else {
                      back.style.display = 'none';
                      front.style.display = 'block';
                      e.target.style.transform = 'rotateY(0deg)';
                    }
                  }}>
                    <div className="front" style={{ display: 'block' }}>
                      <p style={{ fontWeight: "bold", margin: 0 }}>{card.front}</p>
                    </div>
                    <div className="back" style={{ display: 'none' }}>
                      <p style={{ margin: 0 }}>{card.back}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {activeTab === "activity" && (
          <div>
            <h2 style={{ textAlign: "center", marginBottom: "30px" }}>🎮 Learn 7 Fun Activities</h2>
            {!activityDone ? (
              <div style={{ background: "#fff", padding: "30px", borderRadius: "10px", boxShadow: "0 4px 20px rgba(0,0,0,0.1)" }}>
                <h3 style={{ marginBottom: "20px" }}>Guess the Region! (Activity {activityStep + 1} of 7)</h3>
                <p style={{ fontSize: "18px", marginBottom: "20px" }}>Clues: {ACTIVITY_QUESTIONS[activityStep].clues.join(", ")}</p>
                <input type="text" value={activityInput} onChange={(e) => setActivityInput(e.target.value)} placeholder="Your guess..." style={{ padding: "10px", width: "100%", marginBottom: "15px", border: "1px solid #ccc", borderRadius: "5px", fontSize: "16px" }} />
                <div style={{ display: "flex", gap: "10px" }}>
                  <button onClick={handleActivityCheck} style={{
                    padding: "10px 20px",
                    background: "#4CAF50",
                    color: "#fff",
                    border: "none",
                    borderRadius: "5px",
                    cursor: "pointer",
                    boxShadow: "0 4px 10px rgba(76,175,80,0.3)",
                    transition: "all 0.3s ease",
                    flex: 1
                  }}
                  onMouseEnter={(e) => {
                    e.target.style.transform = "translateY(-2px) scale(1.05)";
                    e.target.style.boxShadow = "0 6px 20px rgba(76,175,80,0.6)";
                  }}
                  onMouseLeave={(e) => {
                    e.target.style.transform = "translateY(0) scale(1)";
                    e.target.style.boxShadow = "0 4px 10px rgba(76,175,80,0.3)";
                  }}>Check</button>
                  <button onClick={handleActivityNext} style={{
                    padding: "10px 20px",
                    background: "#2196F3",
                    color: "#fff",
                    border: "none",
                    borderRadius: "5px",
                    cursor: "pointer",
                    boxShadow: "0 4px 10px rgba(33,150,243,0.3)",
                    transition: "all 0.3s ease",
                    flex: 1
                  }}
                  onMouseEnter={(e) => {
                    e.target.style.transform = "translateY(-2px) scale(1.05)";
                    e.target.style.boxShadow = "0 6px 20px rgba(33,150,243,0.6)";
                  }}
                  onMouseLeave={(e) => {
                    e.target.style.transform = "translateY(0) scale(1)";
                    e.target.style.boxShadow = "0 4px 10px rgba(33,150,243,0.3)";
                  }}>Skip</button>
                </div>
                {activityResult && <p style={{ marginTop: "10px", fontSize: "18px", color: activityResult === "Correct!" ? "#4CAF50" : "#f44336", fontWeight: "bold" }}>{activityResult}</p>}
              </div>
            ) : (
              <div style={{ background: "#fff", padding: "30px", borderRadius: "10px", textAlign: "center", boxShadow: "0 4px 20px rgba(0,0,0,0.1)" }}>
                <h3>Activity Complete!</h3>
                <p style={{ fontSize: "24px", marginBottom: "20px" }}>Score: {activityScore}/{ACTIVITY_QUESTIONS.length}</p>
                <button onClick={resetActivity} style={{
                  padding: "10px 20px",
                  background: "#4CAF50",
                  color: "#fff",
                  border: "none",
                  borderRadius: "5px",
                  cursor: "pointer",
                  boxShadow: "0 4px 10px rgba(76,175,80,0.3)",
                  transition: "all 0.3s ease"
                }}
                onMouseEnter={(e) => {
                  e.target.style.transform = "translateY(-2px) scale(1.05)";
                  e.target.style.boxShadow = "0 6px 20px rgba(76,175,80,0.6)";
                }}
                onMouseLeave={(e) => {
                  e.target.style.transform = "translateY(0) scale(1)";
                  e.target.style.boxShadow = "0 4px 10px rgba(76,175,80,0.3)";
                }}>Try Again</button>
              </div>
            )}
          </div>
        )}

        {activeTab === "report" && (
          <div style={{ background: "#fff", padding: "30px", borderRadius: "10px", boxShadow: "0 4px 20px rgba(0,0,0,0.1)" }}>
            <h2 style={{ textAlign: "center", marginBottom: "30px" }}>📊 Report Card</h2>
            <div style={{ display: "flex", justifyContent: "space-around", marginBottom: "30px", flexWrap: "wrap", gap: "20px" }}>
              <div style={{ textAlign: "center" }}>
                <p style={{ fontSize: "48px", color: "#4CAF50", margin: "0" }}>{quizPercent}%</p>
                <p style={{ margin: "0", color: "#666" }}>Quiz</p>
              </div>
              <div style={{ textAlign: "center" }}>
                <p style={{ fontSize: "48px", color: "#2196F3", margin: "0" }}>{activityPercent}%</p>
                <p style={{ margin: "0", color: "#666" }}>Activity</p>
              </div>
              <div style={{ textAlign: "center" }}>
                <p style={{ fontSize: "48px", color: "#FF9800", margin: "0" }}>{overallPercent}%</p>
                <p style={{ margin: "0", color: "#666" }}>Overall</p>
              </div>
            </div>
            <div style={{ textAlign: "center" }}>
              <p style={{ fontSize: "24px", margin: "0" }}>Grade: <strong style={{ color: grade === "A+" ? "#4CAF50" : grade === "A" ? "#2196F3" : "#FF9800" }}>{grade}</strong></p>
            </div>
          </div>
        )}

        {activeTab === "doubt" && (
          <div style={{ background: "#fff", padding: "30px", borderRadius: "10px", boxShadow: "0 4px 20px rgba(0,0,0,0.1)" }}>
            <h2 style={{ textAlign: "center", marginBottom: "30px" }}>💬 Ask Your Doubt</h2>
            <div style={{ marginBottom: "20px" }}>
              <input type="text" value={doubt} onChange={(e) => setDoubt(e.target.value)} placeholder="Ask a question..." style={{ padding: "10px", width: "100%", border: "1px solid #ccc", borderRadius: "5px", fontSize: "16px", marginBottom: "10px" }} />
              <button onClick={handleAskDoubt} disabled={aiLoading} style={{
                padding: "10px 20px",
                background: "#4CAF50",
                color: "#fff",
                border: "none",
                borderRadius: "5px",
                cursor: "pointer",
                boxShadow: "0 4px 10px rgba(76,175,80,0.3)",
                transition: "all 0.3s ease",
                width: "100%",
                opacity: aiLoading ? 0.5 : 1
              }}
              onMouseEnter={(e) => {
                if (!aiLoading) {
                  e.target.style.transform = "translateY(-2px) scale(1.05)";
                  e.target.style.boxShadow = "0 6px 20px rgba(76,175,80,0.6)";
                }
              }}
              onMouseLeave={(e) => {
                e.target.style.transform = "translateY(0) scale(1)";
                e.target.style.boxShadow = "0 4px 10px rgba(76,175,80,0.3)";
              }}>
                {aiLoading ? "⏳ Thinking..." : "Ask AI"}
              </button>
            </div>
            <div>
              {doubts.map((d, i) => (
                <div key={i} style={{ marginBottom: "15px", padding: "15px", background: "#f0f0f0", borderRadius: "5px" }}>
                  <p style={{ margin: "0 0 10px", fontWeight: "bold" }}>Q: {d.question}</p>
                  <p style={{ margin: "0" }}>A: {d.answer}</p>
                </div>
              ))}
            </div>
          </div>
        )}
      </main>

      <footer style={{ background: "#333", color: "#fff", padding: "20px", textAlign: "center", marginTop: "40px" }}>
        <p style={{ margin: "0" }}>🌍 Geographical Diversity of India • Interactive Learning Platform</p>
      </footer>
        </>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
